function savePurchaseDocument(fromPOId = '') {
  const number = document.getElementById('pdoc-num').value.trim();
  const date = document.getElementById('pdoc-date').value || todayStr();
  const dueOrExpDate = document.getElementById('pdoc-due').value || todayStr();
  const vendorName = document.getElementById('doc-recip-name').value.trim();
  const vendorTin = document.getElementById('doc-recip-tin').value.trim();
  const vendorAddress = document.getElementById('doc-recip-addr').value.trim();
  const vendorContact = document.getElementById('doc-recip-contact').value.trim();
  const notes = document.getElementById('pdoc-notes').value.trim();

  if (!vendorName) {
    showToast('Vendor Name is required!', 'error');
    return;
  }

  const validItems = gridRows.filter(r => r.name.trim() && (Number(r.qty) || 0) > 0).map(r => ({
    itemId: r.itemId || '',
    code: r.code || '',
    name: r.name.trim(),
    description: r.name.trim(),
    qty: Number(r.qty) || 0,
    cost: Number(r.cost) || 0,
    total: Number(r.total) || 0
  }));

  if (validItems.length === 0) {
    showToast('Add at least one line item with quantity > 0.', 'error');
    return;
  }

  let vendorId = selectedRecipientId;
  if (!vendorId) {
    const existing = db.vendors.find(v => v.name.toLowerCase() === vendorName.toLowerCase());
    if (existing) {
      vendorId = existing.id;
    } else {
      const newVend = { id: uid('vend'), name: vendorName, tin: vendorTin, address: vendorAddress, contact: vendorContact };
      db.vendors.push(newVend);
      vendorId = newVend.id;
    }
  }

  const total = validItems.reduce((s, l) => s + Number(l.total), 0);
  const createdAt = nowTimestamp();

  if (activeDocMode === 'bill') {
    const expenseAccountId = document.getElementById('pdoc-exp-acc')?.value || '';
    // Only add stock for Inventory items (skip Non-Inventory parts)
    validItems.forEach(line => {
      if (line.itemId) {
        const itm = db.items.find(i => i.id === line.itemId);
        if (itm) {
          if (itm.itemType !== 'non-inventory') {
            itm.stock = (Number(itm.stock) || 0) + (Number(line.qty) || 0);
          }
          if (line.cost > 0) itm.cost = Number(line.cost);
        }
      }
    });

    db.bills.unshift({
      id: uid('bill'), number, date, createdAt, dueDate: dueOrExpDate,
      vendorId, vendorName, vendorTin, vendorAddress, vendorContact,
      expenseAccountId, status: 'Unpaid', paidAmount: 0, notes, items: validItems, total
    });
    commitDocNumber('bill', number);

    if (fromPOId) {
      const po = db.purchaseOrders.find(p => p.id === fromPOId);
      if (po) po.status = 'Billed';
    }
    showToast(`Vendor bill ${number} saved.`);
  } else {
    db.purchaseOrders.unshift({
      id: uid('po'), number, date, createdAt, expectedDate: dueOrExpDate,
      vendorId, vendorName, vendorTin, vendorAddress, vendorContact,
      status: 'Open', notes, items: validItems, total
    });
    commitDocNumber('po', number);
    showToast(`Purchase Order ${number} created.`);
  }

  saveDatabase();
  closeModal();
  renderCurrentView();
}

function onSelectBillToPay(billId) {
  const b = db.bills.find(x => x.id === billId);
  if (!b) return;
  const bal = Math.max(0, Number(b.total) - (Number(b.paidAmount) || 0));
  document.getElementById('pb-amt').value = bal.toFixed(2);
}

function savePayBill() {
  const number = document.getElementById('pb-num').value.trim();
  const date = document.getElementById('pb-date').value || todayStr();
  const billId = document.getElementById('pb-bill').value;
  const bankId = document.getElementById('pb-bank').value;
  const amount = parseFloat(document.getElementById('pb-amt').value) || 0;
  const notes = document.getElementById('pb-notes').value.trim();

  const bill = db.bills.find(b => b.id === billId);
  if (!bill || amount <= 0) {
    showToast('Select a bill and enter a valid payment amount.', 'error');
    return;
  }

  bill.paidAmount = (Number(bill.paidAmount) || 0) + amount;
  bill.status = bill.paidAmount >= bill.total - 0.009 ? 'Paid' : 'Partial';

  const bank = db.banks.find(b => b.id === bankId);
  if (bank) bank.balance = (Number(bank.balance) || 0) - amount;

  db.billPayments.unshift({
    id: uid('bp'), number, date, createdAt: nowTimestamp(), billId: bill.id, billNumber: bill.number,
    vendorId: bill.vendorId, vendorName: bill.vendorName, bankId, amount, notes
  });
  commitDocNumber('billPayment', number);
  saveDatabase();
  closeModal();
  renderCurrentView();
  showToast(`Bill ${bill.number} payment recorded.`);
}

function saveExpense() {
  const number = document.getElementById('ex-num').value.trim();
  const date = document.getElementById('ex-date').value || todayStr();
  const expenseAccountId = document.getElementById('ex-acc').value;
  const bankId = document.getElementById('ex-bank').value;
  const payee = document.getElementById('ex-payee').value.trim();
  const amount = parseFloat(document.getElementById('ex-amt').value) || 0;
  const notes = document.getElementById('ex-notes').value.trim();

  if (amount <= 0) { showToast('Enter a valid expense amount.', 'error'); return; }
  const bank = db.banks.find(b => b.id === bankId);
  if (bank) bank.balance = (Number(bank.balance) || 0) - amount;

  db.expenses.unshift({ id: uid('exp'), number, date, createdAt: nowTimestamp(), expenseAccountId, vendorId: '', payee, bankId, amount, notes });

  saveDatabase();
  closeModal();
  renderCurrentView();
  showToast('Expense recorded.');
}

function saveEmployee(empId) {
  const name = document.getElementById('emp-name').value.trim();
  const position = document.getElementById('emp-pos').value.trim();
  const basicPay = parseFloat(document.getElementById('emp-basic').value) || 0;
  const allowance = parseFloat(document.getElementById('emp-allow').value) || 0;
  const deductions = parseFloat(document.getElementById('emp-ded').value) || 0;
  const tin = document.getElementById('emp-tin').value.trim();
  if (!name) { showToast('Employee name is required.', 'error'); return; }

  if (empId) {
    const idx = db.employees.findIndex(x => x.id === empId);
    if (idx >= 0) db.employees[idx] = { ...db.employees[idx], name, position, basicPay, allowance, deductions, tin };
  } else {
    db.employees.push({ id: uid('emp'), name, position, basicPay, allowance, deductions, tin, sss: '' });
  }
  saveDatabase();
  closeModal();
  renderCurrentView();
  showToast('Employee saved.');
}

        </select>
      </div>
      <div class="sm:col-span-2 p-3.5 rounded-xl bg-slate-50 border border-slate-200 flex justify-between items-center">
        <span class="text-xs font-semibold text-slate-700">NET TAKE-HOME PAY:</span>

  `, `
    <button onclick="closeModal()" class="px-4 py-2 rounded-xl border border-slate-200 text-xs">Cancel</button>

  `);

function onPayrollEmpChange(empId) {
  const e = db.employees.find(x => x.id === empId);
  if (!e) return;
  document.getElementById('pr-basic').value = (e.basicPay / 2).toFixed(2);
  document.getElementById('pr-allow').value = (e.allowance / 2).toFixed(2);
  document.getElementById('pr-ded').value = (e.deductions / 2).toFixed(2);
  calcNetPay();
}

function calcNetPay() {
  const b = parseFloat(document.getElementById('pr-basic')?.value) || 0;
  const a = parseFloat(document.getElementById('pr-allow')?.value) || 0;
  const d = parseFloat(document.getElementById('pr-ded')?.value) || 0;
  const el = document.getElementById('pr-net-display');
  if (el) el.textContent = fmtMoney(Math.max(0, b + a - d));
}

function savePayrollRun() {
  const number = document.getElementById('pr-num').value.trim();
  const date = document.getElementById('pr-date').value || todayStr();
  const employeeId = document.getElementById('pr-emp').value;
  const period = document.getElementById('pr-period').value.trim();
  const basicPay = parseFloat(document.getElementById('pr-basic').value) || 0;
  const allowance = parseFloat(document.getElementById('pr-allow').value) || 0;
  const deductions = parseFloat(document.getElementById('pr-ded').value) || 0;
  const bankId = document.getElementById('pr-bank').value;
  const netPay = Math.max(0, basicPay + allowance - deductions);

  const emp = db.employees.find(e => e.id === employeeId);
  const bank = db.banks.find(b => b.id === bankId);
  if (bank) bank.balance = (Number(bank.balance) || 0) - netPay;

  db.payrolls.unshift({
    id: uid('pr'), number, date, createdAt: nowTimestamp(), period, employeeId,
    employeeName: emp?.name || 'Employee', position: emp?.position || '',
    basicPay, allowance, deductions, netPay, bankId, notes: ''
  });
  commitDocNumber('payroll', number);
  saveDatabase();
  closeModal();
  renderCurrentView();
  showToast('Payroll disbursed & payslip generated.');
}

function setPrintOrientation(mode) {
  printOrientation = mode === 'landscape' ? 'landscape' : 'portrait';
  const styleEl = document.getElementById('dynamic-print-page-style');
  if (styleEl) {
    styleEl.innerHTML = printOrientation === 'landscape'
      ? `@media print { @page { size: 8.5in 5.5in landscape; margin: 0.25in; } }`
      : `@media print { @page { size: 5.5in 8.5in portrait; margin: 0.25in; } }`;
  }

  const wrapper = document.getElementById('print-preview-editable-canvas');
  if (wrapper) {
    wrapper.style.maxWidth = printOrientation === 'landscape' ? '8.5in' : '5.5in';
    wrapper.querySelectorAll('.print-page').forEach(pg => {
      if (printOrientation === 'landscape') {
        pg.classList.add('landscape-page');
        pg.style.minHeight = '4.9in';
      } else {
        pg.classList.remove('landscape-page');
        pg.style.minHeight = '7.8in';
      }
    });
  }

  const btnP = document.getElementById('btn-orient-portrait');
  const btnL = document.getElementById('btn-orient-landscape');
  if (btnP && btnL) {
    btnP.className = printOrientation === 'portrait'
      ? 'px-3 py-1 rounded-lg bg-slate-900 text-white text-xs font-medium'
      : 'px-3 py-1 rounded-lg border border-slate-200 bg-white text-slate-700 text-xs font-medium hover:bg-slate-50';
    btnL.className = printOrientation === 'landscape'
      ? 'px-3 py-1 rounded-lg bg-slate-900 text-white text-xs font-medium'
      : 'px-3 py-1 rounded-lg border border-slate-200 bg-white text-slate-700 text-xs font-medium hover:bg-slate-50';
  }
}

function executeEditedPrint() {
  const editedCanvas = document.getElementById('print-preview-editable-canvas');
  const printArea = document.getElementById('print-area');
  if (!editedCanvas || !printArea) return;

  printArea.innerHTML = editedCanvas.innerHTML;
  setTimeout(() => {
    window.print();
  }, 100);
}

      <tr class="border-b border-slate-300">
        <td class="py-1 pr-2" contenteditable="true">${escapeHtml(bp.billNumber)}</td>
        <td class="py-1 pr-2" contenteditable="true">Settlement of Vendor Bill ${escapeHtml(bp.billNumber)}</td>
        <td class="py-1 text-right" contenteditable="true">1</td>
        <td class="py-1 text-right" contenteditable="true">${fmtMoney(bp.amount)}</td>
        <td class="py-1 text-right font-semibold" contenteditable="true">${fmtMoney(bp.amount)}</td>
      </tr>
    `;
    totalAmount = bp.amount;
    notes = bp.notes || '';
    signatoryRight = 'Payee Signature';
  } else if (docType === 'expense') {
    const ex = db.expenses.find(x => x.id === docId);
    if (!ex) return;
    const acc = db.expenseAccounts.find(a => a.id === ex.expenseAccountId)?.name || 'Expense';
    const bank = db.banks.find(b => b.id === ex.bankId)?.name || 'Cash/Bank';
    docTitle = 'EXPENSE VOUCHER';
    docNum = ex.number;
    docDate = `Date: ${ex.date}`;
    docTimestamp = `Timestamp: ${formatTxnTimestamp(ex)}`;
    partyBlock = `<div><strong>Payee:</strong> <span contenteditable="true">${escapeHtml(ex.payee || 'Walk-in Merchant')}</span></div><div><strong>Paid Via:</strong> <span contenteditable="true">${escapeHtml(bank)}</span></div>`;
    rowsHtml = `
      <tr class="border-b border-slate-300">
        <td class="py-1 pr-2" contenteditable="true">EXP</td>
        <td class="py-1 pr-2" contenteditable="true">${escapeHtml(acc)} — ${escapeHtml(ex.notes || 'Operational Expense')}</td>
        <td class="py-1 text-right" contenteditable="true">1</td>
        <td class="py-1 text-right" contenteditable="true">${fmtMoney(ex.amount)}</td>
        <td class="py-1 text-right font-semibold" contenteditable="true">${fmtMoney(ex.amount)}</td>
      </tr>
    `;
    totalAmount = ex.amount;
    notes = ex.notes || '';
  } else if (docType === 'payroll') {
    const pr = db.payrolls.find(x => x.id === docId);
    if (!pr) return;
    docTitle = 'EMPLOYEE PAYSLIP';
    docNum = pr.number;
    docDate = `Pay Date: ${pr.date} | Period: ${pr.period}`;
    docTimestamp = `Timestamp: ${formatTxnTimestamp(pr)}`;
    partyBlock = `<div><strong>Employee:</strong> <span contenteditable="true">${escapeHtml(pr.employeeName)}</span></div><div><strong>Position:</strong> <span contenteditable="true">${escapeHtml(pr.position)}</span></div>`;
    rowsHtml = `
      <tr class="border-b border-slate-300"><td class="py-1">EARN</td><td class="py-1" contenteditable="true">Basic Salary</td><td class="py-1 text-right">1</td><td class="py-1 text-right" contenteditable="true">${fmtMoney(pr.basicPay)}</td><td class="py-1 text-right" contenteditable="true">${fmtMoney(pr.basicPay)}</td></tr>
      <tr class="border-b border-slate-300"><td class="py-1">ALLOW</td><td class="py-1" contenteditable="true">Allowance / Overtime</td><td class="py-1 text-right">1</td><td class="py-1 text-right" contenteditable="true">${fmtMoney(pr.allowance)}</td><td class="py-1 text-right" contenteditable="true">${fmtMoney(pr.allowance)}</td></tr>
      <tr class="border-b border-slate-300"><td class="py-1">DED</td><td class="py-1" contenteditable="true">Statutory & Other Deductions</td><td class="py-1 text-right">1</td><td class="py-1 text-right text-rose-700" contenteditable="true">-${fmtMoney(pr.deductions)}</td><td class="py-1 text-right text-rose-700" contenteditable="true">-${fmtMoney(pr.deductions)}</td></tr>
    `;
    totalAmount = pr.netPay;
    notes = 'Received net pay in full.';
    signatoryRight = 'Employee Signature';
  } else if (docType === 'pnl') {
    const m = calculatePnLMetrics(pnlDateFrom, pnlDateTo);
    docTitle = 'PROFIT & LOSS STATEMENT';
    docNum = 'INCOME-STMT';
    docDate = `Period: ${pnlDateFrom} to ${pnlDateTo}`;
    docTimestamp = `Generated: ${nowTimestamp()}`;
    partyBlock = `<div><strong>Report Scope:</strong> <span contenteditable="true">Accrual / Operational Summary</span></div>`;
    customBodyOverride = `
      <table class="w-full text-[8.5pt] border-collapse my-2">
        <thead>
          <tr class="border-y border-black text-left uppercase text-[7.5pt]">
            <th class="py-1">Account / Line Description</th>
            <th class="py-1 text-right">Amount</th>
          </tr>
        </thead>
        <tbody>
          <tr class="border-b border-slate-300"><td class="py-1" contenteditable="true">Gross Sales Invoiced</td><td class="py-1 text-right" contenteditable="true">${fmtMoney(m.grossSales)}</td></tr>
          <tr class="border-b border-slate-300"><td class="py-1" contenteditable="true">Less: Customer Refunds & Returns</td><td class="py-1 text-right" contenteditable="true">-${fmtMoney(m.salesReturns)}</td></tr>
          <tr class="border-b border-black font-bold"><td class="py-1" contenteditable="true">Net Sales Revenue</td><td class="py-1 text-right" contenteditable="true">${fmtMoney(m.netRevenue)}</td></tr>
          <tr class="border-b border-slate-300"><td class="py-1" contenteditable="true">Cost of Goods Sold (COGS)</td><td class="py-1 text-right" contenteditable="true">${fmtMoney(m.cogs)}</td></tr>
          <tr class="border-b border-black font-bold"><td class="py-1" contenteditable="true">Gross Profit</td><td class="py-1 text-right" contenteditable="true">${fmtMoney(m.grossProfit)}</td></tr>
          ${m.expenseBreakdown.map(e => `
            <tr class="border-b border-slate-300"><td class="py-1" contenteditable="true">OpEx: ${escapeHtml(e.name)}</td><td class="py-1 text-right" contenteditable="true">${fmtMoney(e.amount)}</td></tr>
          `).join('')}
          <tr class="border-b border-black font-bold"><td class="py-1" contenteditable="true">Total Operating Expenses</td><td class="py-1 text-right" contenteditable="true">${fmtMoney(m.totalOpEx)}</td></tr>
        </tbody>
      </table>
    `;
    totalAmount = m.netProfit;
    notes = `Gross Margin: ${m.grossMarginPct.toFixed(1)}%`;
    signatoryRight = 'Approved By Management';
  }

  const pageHtml = `
    <div class="print-page ${printOrientation === 'landscape' ? 'landscape-page' : ''} bg-white text-black font-sans text-[9pt] leading-snug" style="min-height: ${printOrientation === 'landscape' ? '4.9in' : '7.8in'};">
      <div>
        <div class="border-b-2 border-black pb-2 mb-2 flex justify-between items-start gap-2">
          <div>
            <div class="font-bold text-[11pt] uppercase tracking-tight" contenteditable="true">${escapeHtml(db.company.name)}</div>
            <div class="text-[8pt]" contenteditable="true">${escapeHtml(db.company.address)}</div>
            <div class="text-[8pt]" contenteditable="true">TIN: ${escapeHtml(db.company.tin)} | Tel: ${escapeHtml(db.company.contact)}</div>
          </div>
          <div class="text-right shrink-0">
            <div class="font-bold text-[10pt] border border-black px-2 py-0.5 inline-block" contenteditable="true">${docTitle}</div>
            <div class="font-mono font-bold text-[9pt] mt-1" contenteditable="true"># ${escapeHtml(docNum)}</div>
            <div class="text-[7.5pt]" contenteditable="true">${escapeHtml(docDate)}</div>
            <div class="text-[7pt] text-slate-600 font-mono" contenteditable="true">${escapeHtml(docTimestamp)}</div>
          </div>
        </div>

        <div class="border border-slate-400 rounded p-2 mb-2 text-[8.5pt] bg-slate-50/40">
          ${partyBlock}
        </div>

        ${customBodyOverride ? customBodyOverride : `
          <table class="w-full text-[8.5pt] border-collapse my-2">
            <thead>
              <tr class="border-y border-black text-left uppercase text-[7.5pt]">
                <th class="py-1 pr-2">Code</th>
                <th class="py-1 pr-2">Description</th>
                <th class="py-1 text-right">Qty</th>
                <th class="py-1 text-right">Rate</th>
                <th class="py-1 text-right">Amount</th>
              </tr>
            </thead>
            <tbody>
              ${rowsHtml}
            </tbody>
          </table>
        `}
      </div>

      <div class="mt-auto pt-2">
        <div class="border-t-2 border-black pt-1.5 flex justify-between items-center">
          <div class="text-[8pt] max-w-[60%]" contenteditable="true">
            ${notes ? `<strong>Notes:</strong> ${escapeHtml(notes)}` : 'Notes: —'}
          </div>
          <div class="text-right">
            <span class="text-[8pt] uppercase mr-2">${docType === 'pnl' ? (totalAmount >= 0 ? 'NET PROFIT:' : 'NET LOSS:') : 'TOTAL AMOUNT:'}</span>
            <span class="font-bold text-[11pt]" contenteditable="true">${fmtMoney(totalAmount)}</span>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-6 mt-7 pt-2 text-[8pt] text-center">
          <div>
            <div class="border-b border-black h-5"></div>
            <div class="mt-1 font-medium" contenteditable="true">${escapeHtml(signatoryLeft)}</div>
          </div>
          <div>
            <div class="border-b border-black h-5"></div>
            <div class="mt-1 font-medium" contenteditable="true">${escapeHtml(signatoryRight)}</div>
          </div>
        </div>
        <div class="text-center text-[7pt] text-slate-500 mt-2">
          NexusBooks Offline ERP • Half-Bond Format (5.5" × 8.5")
        </div>
      </div>
    </div>
  `;

  openModal('Editable Half-Bond Print Preview (5.5" × 8.5")', `
    <div class="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-slate-200">
      <div class="text-xs text-slate-500">
        Click any text, number, or signatory line below to edit directly before printing.
      </div>
      <div class="flex items-center gap-1.5">
        <span class="text-[11px] font-medium text-slate-400 mr-1">Orientation:</span>
        <button id="btn-orient-portrait" type="button" onclick="setPrintOrientation('portrait')" class="${printOrientation === 'portrait' ? 'px-3 py-1 rounded-lg bg-slate-900 text-white text-xs font-medium' : 'px-3 py-1 rounded-lg border border-slate-200 bg-white text-slate-700 text-xs font-medium hover:bg-slate-50'}">
          Portrait (5.5" × 8.5")
        </button>
        <button id="btn-orient-landscape" type="button" onclick="setPrintOrientation('landscape')" class="${printOrientation === 'landscape' ? 'px-3 py-1 rounded-lg bg-slate-900 text-white text-xs font-medium' : 'px-3 py-1 rounded-lg border border-slate-200 bg-white text-slate-700 text-xs font-medium hover:bg-slate-50'}">
          Landscape (8.5" × 5.5")
        </button>
      </div>
    </div>

    <div class="bg-slate-100 p-4 rounded-xl overflow-x-auto flex justify-center">
      <div id="print-preview-editable-canvas" class="print-editable bg-white shadow-md border border-slate-300 p-5 w-full transition-all" style="max-width: ${printOrientation === 'landscape' ? '8.5in' : '5.5in'};">
        ${pageHtml}
      </div>
    </div>
  `, `
    <button onclick="closeModal()" class="px-4 py-2 rounded-xl border border-slate-200 text-xs font-medium">Cancel</button>
    <button onclick="executeEditedPrint()" class="px-5 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-medium flex items-center gap-1.5">
      🖨 Print Half-Bond Now
    </button>
  `, 'max-w-4xl');

  setPrintOrientation(printOrientation);
}

// ============================================================================
// INITIALIZATION
// ============================================================================
window.addEventListener('DOMContentLoaded', () => {
  navigate('dashboard');
});
</script>
</body>
</html>
