  <style>
    /* Minimalist Scrollbars */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* Excel-style Grid Inputs */
    .excel-cell:focus {
      outline: 1.5px solid #0f172a;
      outline-offset: -1.5px;
      background-color: #f8fafc;
    }

    /* Editable Print Preview Styling */
    .print-editable [contenteditable="true"] {
      outline: 1px dashed #94a3b8;
      border-radius: 3px;
      padding: 1px 3px;
      transition: background-color 0.15s ease, outline-color 0.15s ease;
    }
    .print-editable [contenteditable="true"]:hover,
    .print-editable [contenteditable="true"]:focus {
      background-color: #f8fafc;
      outline: 1.5px solid #0f172a;
    }

    /* Print Engine */
    @media print {
      body * {
        visibility: hidden;
      }
      #print-area, #print-area * {
        visibility: visible;
      }
      #print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        background: white !important;
        color: black !important;
        font-size: 9pt;
      }
      #print-area [contenteditable="true"] {
        outline: none !important;
        background: transparent !important;
        padding: 0 !important;
      }
      .print-page {
        width: 100%;
        min-height: 7.8in;
        page-break-after: always;
        break-after: page;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        box-sizing: border-box;
        padding: 4px;
      }
      .print-page.landscape-page {
        min-height: 4.9in;
      }
      .print-page:last-child {
        page-break-after: auto;
        break-after: auto;
      }
      .no-print {
        display: none !important;
      }
    }

// Currency & Number Formatting (Philippine Peso ₱ with comma separators)
const fmtMoney = (val) => {
  const num = Number(val) || 0;
  return '₱' + num.toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
};

const fmtNum = (val) => {
  const num = Number(val) || 0;
  return num.toLocaleString('en-PH', { maximumFractionDigits: 2 });
};

const todayStr = () => new Date().toISOString().split('T')[0];

const nowTimestamp = () => {
  const d = new Date();
  const pad = (n) => String(n).padStart(2, '0');
  const datePart = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const timePart = d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
  return `${datePart} ${timePart}`;
};

const formatTxnTimestamp = (txn) => {
  if (txn && txn.createdAt) return txn.createdAt;
  if (txn && txn.date) return `${txn.date} 09:00:00 AM`;
  return '—';
};

const addDaysStr = (days) => {
  const d = new Date();
  d.setDate(d.getDate() + Number(days));
  return d.toISOString().split('T')[0];
};

const uid = (prefix = 'id') => `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;

// ============================================================================
// FUZZY / SMART SEARCH UTILITY
// ============================================================================
function fuzzyMatch(query, ...fields) {
  if (!query || !query.trim()) return true;
  const q = query.toLowerCase().trim();
  const combined = fields.filter(Boolean).join(' ').toLowerCase();
  if (combined.includes(q)) return true;

  const tokens = q.split(/\s+/);
  return tokens.every(token => {
    if (combined.includes(token)) return true;
    let ti = 0;
    for (let ci = 0; ci < combined.length && ti < token.length; ci++) {
      if (combined[ci] === token[ti]) ti++;
    }
    return ti === token.length;
  });
}

function renderSearchBar(id, currentVal, placeholder, onInputFnName, onClearFnName) {
  return `
    <div class="relative flex items-center w-full sm:max-w-md">
      <svg class="w-4 h-4 text-slate-400 absolute left-3.5 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
      </svg>
      <input
        id="${id}"
        type="text"
        value="${escapeHtml(currentVal || '')}"
        oninput="${onInputFnName}(this.value)"
        placeholder="${escapeHtml(placeholder)}"
        class="w-full pl-9 pr-16 py-2 text-xs sm:text-sm bg-white border border-slate-200 rounded-xl focus:border-slate-900 outline-none transition"
      />
      ${currentVal ? `
        <button type="button" onclick="${onClearFnName}()" class="absolute right-2 px-2 py-0.5 text-[11px] font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition">
          Reset
        </button>
      ` : ''}
    </div>
  `;
}

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

// ============================================================================
// CUSTOMIZABLE AUTO-INCREMENTING TRANSACTION NUMBERING (UP TO 9 DIGITS)
// ============================================================================
function parseDocNumber(str) {
  const clean = String(str || '').trim();
  const match = clean.match(/^(.*?)(\d+)$/);
  if (!match) {
    return { prefix: clean ? clean + '-' : '', num: 1, padLength: 3 };
  }
  const prefix = match[1];
  const digitsStr = match[2].slice(0, 9);
  const num = parseInt(digitsStr, 10) || 1;
  const padLength = Math.min(9, digitsStr.length);
  return { prefix, num, padLength };
}

function formatDocNumber(seqObj) {
  const num = Math.min(999999999, Math.max(1, Number(seqObj.nextNum) || 1));
  const pad = Math.min(9, Math.max(1, Number(seqObj.padLength) || 1));
  return `${seqObj.prefix || ''}${String(num).padStart(pad, '0')}`;
}

function commitDocNumber(type, usedNumberStr) {
  const parsed = parseDocNumber(usedNumberStr);
  const nextVal = Math.min(999999999, parsed.num + 1);
  db.sequences[type] = {
    prefix: parsed.prefix,
    nextNum: nextVal,
    padLength: parsed.padLength
  };
}

function loadDatabase() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) {
      const dummy = getInitialDummyData();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(dummy));
      return dummy;
    }
    const parsed = JSON.parse(raw);
    if (!Array.isArray(parsed.notesBoard)) parsed.notesBoard = [];
    return parsed;
  } catch (e) {
    console.error('Failed to load database:', e);
    return getInitialDummyData();
  }
}

function saveDatabase() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
  } catch (e) {
    showToast('Error saving data to local storage!', 'error');
  }
}

function showToast(message, type = 'success') {
  const container = document.getElementById('toast-container');
  const el = document.createElement('div');
  const colors = {
    success: 'bg-slate-900 text-white border-slate-800',
    error: 'bg-rose-900 text-white border-rose-800',
    info: 'bg-slate-800 text-white border-slate-700'
  };
  el.className = `pointer-events-auto px-4 py-3 rounded-xl shadow-lg border text-xs font-medium flex items-center justify-between gap-3 transition-all ${colors[type] || colors.info}`;
  el.innerHTML = `<span>${escapeHtml(message)}</span><button onclick="this.parentElement.remove()" class="text-white/60 hover:text-white">✕</button>`;
  container.appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

function exportToExcel() {
  if (typeof XLSX === 'undefined') {
    const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `NexusBooks_Backup_${todayStr()}.json`;
    a.click();
    showToast('SheetJS offline fallback: Exported JSON backup.', 'info');
    return;
  }

  try {
    const wb = XLSX.utils.book_new();
    const sheetMap = {
      Company: [db.company],
      Sequences: Object.entries(db.sequences).map(([key, val]) => ({ type: key, ...val })),
      NotesBoard: db.notesBoard || [],
      Banks: db.banks,
      Customers: db.customers,
      Vendors: db.vendors,
      ExpenseAccounts: db.expenseAccounts,
      Categories: db.categories,
      InventoryItems: db.items,
      Estimates: db.estimates.map(e => ({ ...e, itemsJson: JSON.stringify(e.items) })),
      Invoices: db.invoices.map(i => ({ ...i, itemsJson: JSON.stringify(i.items) })),
      PurchaseOrders: db.purchaseOrders.map(p => ({ ...p, itemsJson: JSON.stringify(p.items) })),
      Bills: db.bills.map(b => ({ ...b, itemsJson: JSON.stringify(b.items) })),
      BillPayments: db.billPayments,
      Expenses: db.expenses,
      PaymentsReceived: db.paymentsReceived,
      Deposits: db.deposits.map(d => ({ ...d, linesJson: JSON.stringify(d.lines) })),
      Transfers: db.transfers,
      Refunds: db.refunds,
      Employees: db.employees,
      Payrolls: db.payrolls
    };

    Object.entries(sheetMap).forEach(([sheetName, rows]) => {
      const cleanRows = rows.map(r => {
        const copy = { ...r };
        delete copy.items;
        delete copy.lines;
        return copy;
      });
      const ws = XLSX.utils.json_to_sheet(cleanRows.length ? cleanRows : [{}]);
      XLSX.utils.book_append_sheet(wb, ws, sheetName.slice(0, 31));
    });

    XLSX.writeFile(wb, `NexusBooks_ERP_${todayStr()}.xlsx`);
    showToast('Database successfully exported to Excel (.xlsx)');
  } catch (err) {
    console.error(err);
    showToast('Failed to export Excel file.', 'error');
  }
}

function importFromExcel(event) {
  const file = event.target.files[0];
  if (!file) return;
  if (typeof XLSX === 'undefined') {
    showToast('Excel parser unavailable offline.', 'error');
    return;
  }

  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, { type: 'array' });
      const readSheet = (name) => {
        const ws = wb.Sheets[name];
        if (!ws) return null;
        const rows = XLSX.utils.sheet_to_json(ws);
        return rows.filter(r => Object.keys(r).length > 0);
      };

      const comp = readSheet('Company');
      if (comp && comp[0] && comp[0].name) db.company = comp[0];

      const seqs = readSheet('Sequences');
      if (seqs && seqs.length) {
        seqs.forEach(s => {
          if (s.type) db.sequences[s.type] = { prefix: s.prefix || '', nextNum: Number(s.nextNum) || 1, padLength: Number(s.padLength) || 3 };
        });
      }

      const simpleKeys = [
        ['NotesBoard', 'notesBoard'],
        ['Banks', 'banks'], ['Customers', 'customers'], ['Vendors', 'vendors'],
        ['ExpenseAccounts', 'expenseAccounts'], ['Categories', 'categories'],
        ['InventoryItems', 'items'], ['BillPayments', 'billPayments'],
        ['Expenses', 'expenses'], ['PaymentsReceived', 'paymentsReceived'],
        ['Transfers', 'transfers'], ['Refunds', 'refunds'],
        ['Employees', 'employees'], ['Payrolls', 'payrolls']
      ];
      simpleKeys.forEach(([sheet, key]) => {
        const rows = readSheet(sheet);
        if (rows) db[key] = rows;
      });

      const parseJsonField = (rows, field, target) => {
        if (!rows) return null;
        return rows.map(r => {
          const obj = { ...r };
          try { obj[target] = obj[field] ? JSON.parse(obj[field]) : []; } catch { obj[target] = []; }
          delete obj[field];
          return obj;
        });
      };

      const est = parseJsonField(readSheet('Estimates'), 'itemsJson', 'items');
      if (est) db.estimates = est;
      const inv = parseJsonField(readSheet('Invoices'), 'itemsJson', 'items');
      if (inv) db.invoices = inv;
      const pos = parseJsonField(readSheet('PurchaseOrders'), 'itemsJson', 'items');
      if (pos) db.purchaseOrders = pos;
      const bills = parseJsonField(readSheet('Bills'), 'itemsJson', 'items');
      if (bills) db.bills = bills;
      const deps = parseJsonField(readSheet('Deposits'), 'linesJson', 'lines');
      if (deps) db.deposits = deps;

      saveDatabase();
      renderCurrentView();
      showToast('Excel database imported successfully!');
    } catch (err) {
      console.error(err);
      showToast('Invalid Excel file format.', 'error');
    }
    event.target.value = '';
  };
  reader.readAsArrayBuffer(file);
}

// 1. MINIMALIST DASHBOARD VIEW (UNPAID INVOICES + BILLS DUE + TASK BOARD)
// ============================================================================
function setDashboardDueDays(days) {
  dashboardDueDays = Math.max(0, parseInt(days, 10) || 0);
  renderCurrentView();
}

function addDashboardNote() {
  const input = document.getElementById('dash-new-note-input');
  const priority = document.getElementById('dash-new-note-priority')?.value || 'Normal';
  const text = (input?.value || '').trim();
  if (!text) {
    showToast('Please enter a note or task description.', 'error');
    return;
  }
  if (!Array.isArray(db.notesBoard)) db.notesBoard = [];
  db.notesBoard.unshift({
    id: uid('note'),
    text,
    done: false,
    priority,
    createdAt: nowTimestamp()
  });
  saveDatabase();
  renderCurrentView();
  showToast('Task added to board.');
}

function toggleDashboardNote(noteId) {
  const note = (db.notesBoard || []).find(n => n.id === noteId);
  if (!note) return;
  note.done = !note.done;
  saveDatabase();
  renderCurrentView();
}

function editDashboardNote(noteId) {
  const note = (db.notesBoard || []).find(n => n.id === noteId);
  if (!note) return;
  openModal('Edit Note / Task', `
    <div class="space-y-3">
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Task / Note Content</label>
        <textarea id="edit-note-text" rows="3" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:border-slate-900 outline-none">${escapeHtml(note.text)}</textarea>
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Priority</label>
        <select id="edit-note-prio" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm bg-white">
          <option value="High" ${note.priority === 'High' ? 'selected' : ''}>High</option>
          <option value="Normal" ${note.priority === 'Normal' ? 'selected' : ''}>Normal</option>
          <option value="Low" ${note.priority === 'Low' ? 'selected' : ''}>Low</option>
        </select>
      </div>
    </div>
  `, `
    <button onclick="closeModal()" class="px-4 py-2 rounded-xl border border-slate-200 text-xs">Cancel</button>
    <button onclick="saveEditedDashboardNote('${note.id}')" class="px-4 py-2 rounded-xl bg-slate-900 text-white text-xs font-medium">Save Note</button>
  `, 'max-w-md');
}

function saveEditedDashboardNote(noteId) {
  const note = (db.notesBoard || []).find(n => n.id === noteId);
  if (!note) return;
  const txt = document.getElementById('edit-note-text').value.trim();
  if (!txt) { showToast('Note cannot be empty.', 'error'); return; }
  note.text = txt;
  note.priority = document.getElementById('edit-note-prio').value || 'Normal';
  saveDatabase();
  closeModal();
  renderCurrentView();
}

function deleteDashboardNote(noteId) {
  db.notesBoard = (db.notesBoard || []).filter(n => n.id !== noteId);
  saveDatabase();
  renderCurrentView();
  showToast('Note removed.');
}

function renderDashboard() {
  const totalCash = db.banks.reduce((s, b) => s + (Number(b.balance) || 0), 0);
  const totalAR = db.invoices.reduce((s, i) => s + Math.max(0, (Number(i.total) || 0) - (Number(i.paidAmount) || 0)), 0);
  const totalAP = db.bills.reduce((s, b) => s + Math.max(0, (Number(b.total) || 0) - (Number(b.paidAmount) || 0)), 0);
  const inventoryVal = db.items.reduce((s, i) => s + ((Number(i.stock) || 0) * (Number(i.cost) || 0)), 0);

  const cutoffDate = addDaysStr(dashboardDueDays);
  const today = todayStr();
  const qBills = searchQueries['dashboard_bills'] || '';
  const qInvoices = searchQueries['dashboard_invoices'] || '';

  const dueBills = db.bills.filter(b => {
    const bal = (Number(b.total) || 0) - (Number(b.paidAmount) || 0);
    if (bal <= 0.009) return false;
    const withinWindow = !b.dueDate || b.dueDate <= cutoffDate;
    return withinWindow && fuzzyMatch(qBills, b.number, b.vendorName, b.dueDate, b.notes);
  }).sort((a, b) => (a.dueDate || '').localeCompare(b.dueDate || ''));

  const unpaidInvoices = db.invoices.filter(inv => {
    const bal = (Number(inv.total) || 0) - (Number(inv.paidAmount) || 0);
    if (bal <= 0.009) return false;
    return fuzzyMatch(qInvoices, inv.number, inv.customerName, inv.dueDate, inv.status, inv.notes);
  }).sort((a, b) => (a.dueDate || '').localeCompare(b.dueDate || ''));

  const notesList = (db.notesBoard || []).filter(n => {
    if (noteFilter === 'open') return !n.done;
    if (noteFilter === 'done') return n.done;
    return true;
  });

  return `
    <!-- Minimalist KPI Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
      <div class="bg-white p-5 rounded-2xl border border-slate-200">
        <div class="flex items-center justify-between">
          <span class="text-[11px] font-medium uppercase tracking-wider text-slate-400">Cash & Banks</span>
          <span class="text-xs text-slate-400">◈</span>
        </div>
        <div class="text-2xl font-semibold text-slate-900 mt-2 tracking-tight">${fmtMoney(totalCash)}</div>
        <div class="text-xs text-slate-400 mt-1">${db.banks.length} active account(s)</div>
      </div>

      <div class="bg-white p-5 rounded-2xl border border-slate-200">
        <div class="flex items-center justify-between">
          <span class="text-[11px] font-medium uppercase tracking-wider text-slate-400">Unpaid Invoices (AR)</span>
          <span class="text-xs text-slate-400">▤</span>
        </div>
        <div class="text-2xl font-semibold text-slate-900 mt-2 tracking-tight">${fmtMoney(totalAR)}</div>
        <div class="text-xs text-slate-400 mt-1">${unpaidInvoices.length} open invoice(s)</div>
      </div>

      <div class="bg-white p-5 rounded-2xl border border-slate-200">
        <div class="flex items-center justify-between">
          <span class="text-[11px] font-medium uppercase tracking-wider text-slate-400">Accounts Payable</span>
          <span class="text-xs text-slate-400">▥</span>
        </div>
        <div class="text-2xl font-semibold text-slate-900 mt-2 tracking-tight">${fmtMoney(totalAP)}</div>
        <div class="text-xs text-slate-400 mt-1">Total unpaid vendor bills</div>
      </div>

      <div class="bg-white p-5 rounded-2xl border border-slate-200">
        <div class="flex items-center justify-between">
          <span class="text-[11px] font-medium uppercase tracking-wider text-slate-400">Inventory Value</span>
          <span class="text-xs text-slate-400">⊞</span>
        </div>
        <div class="text-2xl font-semibold text-slate-900 mt-2 tracking-tight">${fmtMoney(inventoryVal)}</div>
        <div class="text-xs text-slate-400 mt-1">${db.items.length} tracked SKU(s)</div>
      </div>
    </div>

    <!-- Minimalist Quick Actions Bar (Receive Payment Removed) -->
    <div class="bg-white px-4 py-3 rounded-2xl border border-slate-200 flex flex-wrap gap-2 items-center justify-between">
      <span class="text-[11px] font-medium uppercase tracking-wider text-slate-400 px-1">Quick Actions</span>
      <div class="flex flex-wrap gap-2">
        <button onclick="navigate('invoices'); setTimeout(()=>openInvoiceModal(),50)" class="px-3.5 py-1.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-medium transition">+ New Invoice</button>
        <button onclick="navigate('estimates'); setTimeout(()=>openEstimateModal(),50)" class="px-3.5 py-1.5 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-800 text-xs font-medium transition">+ New Estimate</button>
        <button onclick="navigate('enter-bills'); setTimeout(()=>openBillModal(),50)" class="px-3.5 py-1.5 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-800 text-xs font-medium transition">+ Enter Bill</button>
        <button onclick="navigate('expenses'); setTimeout(()=>openExpenseModal(),50)" class="px-3.5 py-1.5 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-800 text-xs font-medium transition">+ Record Expense</button>
        <button onclick="navigate('profit-loss')" class="px-3.5 py-1.5 rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 text-slate-800 text-xs font-medium transition">Profit & Loss Report</button>
      </div>
    </div>

    <!-- Notes & Task Board Widget -->
    <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden">
      <div class="px-5 py-4 border-b border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div>
          <h3 class="text-sm font-semibold text-slate-900 flex items-center gap-2">
            <span>Notes & Task Board</span>
            <span class="px-2 py-0.5 text-[11px] rounded-md bg-slate-100 text-slate-600 font-medium">${(db.notesBoard || []).filter(n => !n.done).length} Pending</span>
          </h3>
          <p class="text-xs text-slate-400 mt-0.5">Quick operational reminders, follow-ups, and daily tasks</p>
        </div>
        <div class="flex items-center gap-1 bg-slate-100 p-1 rounded-xl text-xs w-fit">
          <button onclick="noteFilter='all'; renderCurrentView();" class="px-2.5 py-1 rounded-lg font-medium transition ${noteFilter === 'all' ? 'bg-white text-slate-900 shadow-2xs' : 'text-slate-500 hover:text-slate-800'}">All</button>
          <button onclick="noteFilter='open'; renderCurrentView();" class="px-2.5 py-1 rounded-lg font-medium transition ${noteFilter === 'open' ? 'bg-white text-slate-900 shadow-2xs' : 'text-slate-500 hover:text-slate-800'}">Open</button>
          <button onclick="noteFilter='done'; renderCurrentView();" class="px-2.5 py-1 rounded-lg font-medium transition ${noteFilter === 'done' ? 'bg-white text-slate-900 shadow-2xs' : 'text-slate-500 hover:text-slate-800'}">Done</button>
        </div>
      </div>

      <div class="p-4 bg-slate-50/50 border-b border-slate-100 flex flex-col sm:flex-row gap-2">
        <input
          id="dash-new-note-input"
          type="text"
          onkeydown="if(event.key==='Enter') addDashboardNote()"

        <div class="flex gap-2">
          <select id="dash-new-note-priority" class="px-3 py-2 text-xs bg-white border border-slate-200 rounded-xl text-slate-700 outline-none">

      </div>

      <div class="divide-y divide-slate-100 max-h-72 overflow-y-auto">
        ${notesList.length === 0 ? `
          <div class="py-8 text-center text-slate-400 text-xs">No notes or tasks in this view.</div>
        ` : notesList.map(note => {
          const prioBadge = note.priority === 'High'
            ? 'bg-rose-50 text-rose-700 border-rose-200'

            : 'bg-amber-50 text-amber-700 border-amber-200';
          return `
            <div class="px-5 py-3 flex items-center justify-between gap-3 hover:bg-slate-50/70 transition">
              <div class="flex items-start gap-3 min-w-0 flex-1">
                <input type="checkbox" ${note.done ? 'checked' : ''} onchange="toggleDashboardNote('${note.id}')" class="mt-0.5 w-4 h-4 rounded border-slate-300 text-slate-900 focus:ring-0 cursor-pointer" />
                <div class="min-w-0 flex-1">
                  <div class="text-xs sm:text-sm ${note.done ? 'line-through text-slate-400' : 'text-slate-800 font-medium'}">${escapeHtml(note.text)}</div>
                  <div class="flex items-center gap-2 mt-1">
                    <span class="px-1.5 py-0.2 rounded border text-[10px] font-medium ${prioBadge}">${escapeHtml(note.priority || 'Normal')}</span>
                    <span class="text-[10px] font-mono text-slate-400">${escapeHtml(note.createdAt || '')}</span>
                  </div>
                </div>
              </div>
              <div class="flex items-center gap-1 shrink-0">
                <button onclick="editDashboardNote('${note.id}')" class="px-2 py-1 rounded-lg text-[11px] text-slate-500 hover:bg-slate-100 hover:text-slate-900">Edit</button>
                <button onclick="deleteDashboardNote('${note.id}')" class="px-2 py-1 rounded-lg text-[11px] text-slate-400 hover:bg-rose-50 hover:text-rose-600">✕</button>

            </div>

        }).join('')}
      </div>
    </div>

    <!-- Unpaid & Partially Paid Invoices Section on Dashboard -->
    <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden">
      <div class="px-5 py-4 border-b border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div>
          <h3 class="text-sm font-semibold text-slate-900 flex items-center gap-2">
            <span>Unpaid Invoices</span>
            <span class="px-2 py-0.5 text-[11px] rounded-md bg-slate-100 text-slate-700 font-medium">${unpaidInvoices.length} Open</span>
          </h3>
          <p class="text-xs text-slate-400 mt-0.5">Customer invoices with remaining collectible balance</p>
        </div>
        <div class="flex flex-wrap items-center gap-3">
          ${renderSearchBar('dash-inv-search', qInvoices, 'Search unpaid invoice #, customer...', 'onDashInvSearch', 'clearDashInvSearch')}
          <div class="text-xs text-slate-500 whitespace-nowrap">

              <th class="py-3 px-4 font-medium">Customer</th>
              <th class="py-3 px-4 font-medium">Timestamp</th>
              <th class="py-3 px-4 font-medium">Due Date</th>
              <th class="py-3 px-4 font-medium">Status</th>
              <th class="py-3 px-4 font-medium text-right">Balance Due</th>
              <th class="py-3 px-4 font-medium text-right">Action</th>

            ` : unpaidInvoices.map(inv => {
              const bal = Math.max(0, (Number(inv.total) || 0) - (Number(inv.paidAmount) || 0));
              const isOverdue = inv.dueDate && inv.dueDate < today;
              return `
                <tr class="hover:bg-slate-50/70 transition">
                  <td class="py-3 px-4 font-semibold text-slate-900">${escapeHtml(inv.number)}</td>
                  <td class="py-3 px-4 text-slate-700">${escapeHtml(inv.customerName)}</td>
                  <td class="py-3 px-4 font-mono text-[11px] text-slate-400">${escapeHtml(formatTxnTimestamp(inv))}</td>
                  <td class="py-3 px-4 font-mono text-xs ${isOverdue ? 'text-rose-600 font-medium' : 'text-slate-600'}">${escapeHtml(inv.dueDate || '—')}</td>
                  <td class="py-3 px-4">
                    <span class="px-2 py-0.5 rounded-md text-[11px] font-medium border ${isOverdue ? 'bg-rose-50 text-rose-700 border-rose-200' : inv.status === 'Partial' ? 'bg-amber-50 text-amber-700 border-amber-200' : 'bg-slate-50 text-slate-700 border-slate-200'}">

                    </span>
                  </td>
                  <td class="py-3 px-4 text-right font-semibold text-slate-900">${fmtMoney(bal)}</td>
                  <td class="py-3 px-4 text-right space-x-1">
                    <button onclick="markInvoicePaidStatus('${inv.id}')" class="px-2.5 py-1 rounded-lg bg-slate-900 hover:bg-slate-800 text-white text-[11px] font-medium">Mark Paid</button>
                    <button onclick="printDocument('invoice', '${inv.id}')" class="px-2 py-1 rounded-lg border border-slate-200 hover:bg-slate-100 text-[11px] text-slate-600">Print</button>
                  </td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      </div>

    <!-- Bills To Be Paid — Interactive Days Due Selector -->
    <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden">
      <div class="px-5 py-4 border-b border-slate-100 flex flex-col lg:flex-row lg:items-center justify-between gap-4">
        <div>
          <h3 class="text-sm font-semibold text-slate-900 flex items-center gap-2">
            <span>Bills To Be Paid</span>
            <span class="px-2 py-0.5 text-[11px] rounded-md bg-slate-100 text-slate-700 font-medium">${dueBills.length} Due</span>
          </h3>
          <p class="text-xs text-slate-400 mt-0.5">Unpaid & partial bills due on or before <span class="text-slate-700 font-medium">${cutoffDate}</span> (within ${dashboardDueDays}d)</p>

        <div class="flex flex-wrap items-center gap-2">
          <div class="flex items-center bg-slate-100 rounded-xl p-1 text-xs">
            ${[0, 3, 7, 15, 30, 60].map(d => `
              <button onclick="setDashboardDueDays(${d})" class="px-2.5 py-1 rounded-lg font-medium transition ${dashboardDueDays === d ? 'bg-white text-slate-900 shadow-2xs' : 'text-slate-500 hover:text-slate-800'}">

          <thead class="bg-slate-50/80 text-slate-400 text-[11px] uppercase tracking-wider border-b border-slate-200">

              <th class="py-3 px-4 font-medium">Vendor</th>
              <th class="py-3 px-4 font-medium">Timestamp</th>

              <th class="py-3 px-4 font-medium">Status</th>
              <th class="py-3 px-4 font-medium text-right">Balance Due</th>
              <th class="py-3 px-4 font-medium text-right">Action</th>

              <tr><td colspan="7" class="py-8 text-center text-slate-400 text-xs">No unpaid bills due within the next ${dashboardDueDays} days.</td></tr>

              const bal = (Number(b.total) || 0) - (Number(b.paidAmount) || 0);

              const isToday = b.dueDate === today;

                <tr class="hover:bg-slate-50/70 transition">

                  <td class="py-3 px-4 font-mono text-[11px] text-slate-400">${escapeHtml(formatTxnTimestamp(b))}</td>
                  <td class="py-3 px-4 font-mono text-xs text-slate-600">${escapeHtml(b.dueDate || 'N/A')}</td>
                  <td class="py-3 px-4">
                    ${isOverdue ? `<span class="px-2 py-0.5 rounded-md text-[11px] font-medium bg-rose-50 text-rose-700 border border-rose-200">Overdue</span>` :
                      isToday ? `<span class="px-2 py-0.5 rounded-md text-[11px] font-medium bg-amber-50 text-amber-700 border border-amber-200">Due Today</span>` :
                      `<span class="px-2 py-0.5 rounded-md text-[11px] font-medium bg-slate-50 text-slate-600 border border-slate-200">Upcoming</span>`}
                  </td>
                  <td class="py-3 px-4 text-right font-semibold text-slate-900">${fmtMoney(bal)}</td>
                  <td class="py-3 px-4 text-right space-x-1">
                    <button onclick="openPayBillModal('${b.id}')" class="px-2.5 py-1 rounded-lg bg-slate-900 hover:bg-slate-800 text-white text-[11px] font-medium">Pay Now</button>
                    <button onclick="printDocument('bill', '${b.id}')" class="px-2 py-1 rounded-lg border border-slate-200 hover:bg-slate-100 text-[11px] text-slate-600">Print</button>
                  </td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>

    <!-- Bank Balances Snapshot -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
      ${db.banks.map(bank => `
        <div onclick="navigate('banks')" class="cursor-pointer bg-white p-4 rounded-2xl border border-slate-200 hover:border-slate-400 transition">
          <div class="text-[11px] font-medium text-slate-400">${escapeHtml(bank.bankName)}</div>
          <div class="font-semibold text-sm text-slate-900 truncate mt-0.5">${escapeHtml(bank.name)}</div>
          <div class="text-lg font-semibold text-slate-900 mt-2">${fmtMoney(bank.balance)}</div>
          <div class="text-[11px] text-slate-400 font-mono mt-0.5">${escapeHtml(bank.accountNo || '')}</div>
        </div>
      `).join('')}
    </div>
  `;
}

function onDashBillSearch(val) { searchQueries['dashboard_bills'] = val; renderCurrentView(); }
function clearDashBillSearch() { searchQueries['dashboard_bills'] = ''; renderCurrentView(); }
function onDashInvSearch(val) { searchQueries['dashboard_invoices'] = val; renderCurrentView(); }
function clearDashInvSearch() { searchQueries['dashboard_invoices'] = ''; renderCurrentView(); }

function markInvoicePaidStatus(invId) {
  const inv = db.invoices.find(i => i.id === invId);
  if (!inv) return;
  inv.paidAmount = Number(inv.total) || 0;
  inv.status = 'Paid';
  saveDatabase();
  renderCurrentView();
  showToast(`Invoice ${inv.number} marked as Paid.`);

function setPnLRangePreset(preset) {
  const now = new Date();
  const y = now.getFullYear();
  const m = now.getMonth();
  const pad = (n) => String(n).padStart(2, '0');

  if (preset === 'this_month') {
    pnlDateFrom = `${y}-${pad(m + 1)}-01`;
    pnlDateTo = todayStr();
  } else if (preset === 'last_month') {
    const firstLast = new Date(y, m - 1, 1);
    const lastLast = new Date(y, m, 0);
    pnlDateFrom = `${firstLast.getFullYear()}-${pad(firstLast.getMonth() + 1)}-01`;
    pnlDateTo = `${lastLast.getFullYear()}-${pad(lastLast.getMonth() + 1)}-${pad(lastLast.getDate())}`;
  } else if (preset === 'this_quarter') {
    const qStartMonth = Math.floor(m / 3) * 3;
    pnlDateFrom = `${y}-${pad(qStartMonth + 1)}-01`;
    pnlDateTo = todayStr();
  } else if (preset === 'ytd') {
    pnlDateFrom = `${y}-01-01`;
    pnlDateTo = todayStr();
  } else if (preset === 'all') {
    pnlDateFrom = '2000-01-01';
    pnlDateTo = '2099-12-31';
  }
  renderCurrentView();
}

function updatePnLDates() {
  const f = document.getElementById('pnl-from')?.value;
  const t = document.getElementById('pnl-to')?.value;
  if (f) pnlDateFrom = f;
  if (t) pnlDateTo = t;
  renderCurrentView();
}

function calculatePnLMetrics(fromDate, toDate) {
  const inRange = (d) => {
    if (!d) return false;
    return d >= fromDate && d <= toDate;
  };

  // 1. Gross Sales Revenue from Invoices in date range
  const rangeInvoices = db.invoices.filter(i => inRange(i.date));
  const grossSales = rangeInvoices.reduce((s, i) => s + (Number(i.total) || 0), 0);

  // Customer Refunds in range
  const rangeCustRefunds = db.refunds.filter(r => r.refundType === 'Customer Refund' && inRange(r.date));
  const salesReturns = rangeCustRefunds.reduce((s, r) => s + (Number(r.amount) || 0), 0);

  const netRevenue = grossSales - salesReturns;

  // 2. Cost of Goods Sold (COGS from invoiced inventory items' unit cost * qty)
  let cogs = 0;
  rangeInvoices.forEach(inv => {
    (inv.items || []).forEach(line => {
      if (line.itemId) {
        const itm = db.items.find(x => x.id === line.itemId);
        const unitCost = itm ? (Number(itm.cost) || 0) : 0;
        cogs += unitCost * (Number(line.qty) || 0);
      }
    });
  });

  const grossProfit = netRevenue - cogs;
  const grossMarginPct = netRevenue > 0 ? (grossProfit / netRevenue) * 100 : 0;

  // 3. Operating Expenses grouped by Expense Account
  const expenseMap = {};
  db.expenseAccounts.forEach(ea => {
    expenseMap[ea.id] = { id: ea.id, code: ea.code || '', name: ea.name, amount: 0 };
  });
  expenseMap['unassigned'] = { id: 'unassigned', code: '6999', name: 'General / Uncategorized Operating Expenses', amount: 0 };

  // Direct Expenses in range
  db.expenses.filter(e => inRange(e.date)).forEach(e => {
    const key = expenseMap[e.expenseAccountId] ? e.expenseAccountId : 'unassigned';
    expenseMap[key].amount += (Number(e.amount) || 0);
  });

  // Expense-categorized Supplier Bills in range
  db.bills.filter(b => b.expenseAccountId && inRange(b.date)).forEach(b => {
    const key = expenseMap[b.expenseAccountId] ? b.expenseAccountId : 'unassigned';
    expenseMap[key].amount += (Number(b.total) || 0);
  });

  // Payroll Expense in range
  const rangePayrolls = db.payrolls.filter(p => inRange(p.date));
  const payrollTotal = rangePayrolls.reduce((s, p) => s + (Number(p.netPay) || 0), 0);

  const expenseBreakdown = Object.values(expenseMap).filter(x => x.amount > 0);
  if (payrollTotal > 0) {
    expenseBreakdown.push({ id: 'payroll_exp', code: '6100', name: 'Salaries & Payroll Disbursements', amount: payrollTotal });
  }

  const totalOpEx = expenseBreakdown.reduce((s, x) => s + x.amount, 0);
  const netProfit = grossProfit - totalOpEx;

  return {
    rangeInvoices,
    grossSales,
    salesReturns,
    netRevenue,
    cogs,
    grossProfit,
    grossMarginPct,
    expenseBreakdown,
    totalOpEx,
    netProfit
  };
}

function saveBank(bankId) {
  const name = document.getElementById('bk-name').value.trim();
  const bankName = document.getElementById('bk-bank').value.trim();
  const accountNo = document.getElementById('bk-accno').value.trim();
  const balance = parseFloat(document.getElementById('bk-bal').value) || 0;
  if (!name || !bankName) {
    showToast('Account Name and Bank Name are required.', 'error');
    return;
  }
  if (bankId) {
    const idx = db.banks.findIndex(x => x.id === bankId);
    if (idx >= 0) db.banks[idx] = { ...db.banks[idx], name, bankName, accountNo, balance };
  } else {
    db.banks.push({ id: uid('bank'), name, bankName, accountNo, balance });
  }
  saveDatabase();
  closeModal();
  renderCurrentView();
  showToast('Bank account saved.');
}

function viewBankLedger(bankId) {
  const bank = db.banks.find(b => b.id === bankId);
  if (!bank) return;
  const txns = [];

  db.paymentsReceived.filter(p => p.bankId === bankId).forEach(p => {
    txns.push({ ts: formatTxnTimestamp(p), ref: p.number, type: 'Customer Payment', party: p.customerName, amount: +Number(p.amount) });
  });
  db.billPayments.filter(p => p.bankId === bankId).forEach(p => {
    txns.push({ ts: formatTxnTimestamp(p), ref: p.number, type: 'Bill Payment', party: p.vendorName, amount: -Number(p.amount) });
  });
  db.expenses.filter(e => e.bankId === bankId).forEach(e => {
    txns.push({ ts: formatTxnTimestamp(e), ref: e.number, type: 'Expense', party: e.payee || 'Direct Expense', amount: -Number(e.amount) });
  });
  db.deposits.forEach(d => {
    if (d.toBankId === bankId) txns.push({ ts: formatTxnTimestamp(d), ref: d.number, type: 'Bank Deposit In', party: d.notes || 'Deposit', amount: +Number(d.total) });
    (d.lines || []).forEach(l => {
      if (l.fromBankId === bankId) txns.push({ ts: formatTxnTimestamp(d), ref: d.number, type: 'Deposit Source Out', party: l.sourceLabel, amount: -Number(l.amount) });
    });
  });
  db.transfers.forEach(t => {
    if (t.toBankId === bankId) txns.push({ ts: formatTxnTimestamp(t), ref: t.number, type: 'Transfer In', party: t.notes || 'Bank Transfer', amount: +Number(t.amount) });
    if (t.fromBankId === bankId) txns.push({ ts: formatTxnTimestamp(t), ref: t.number, type: 'Transfer Out', party: t.notes || 'Bank Transfer', amount: -Number(t.amount) });
  });
  db.refunds.filter(r => r.bankId === bankId).forEach(r => {
    const sign = r.refundType === 'Customer Refund' ? -1 : 1;
    txns.push({ ts: formatTxnTimestamp(r), ref: r.number, type: r.refundType, party: r.partyName, amount: sign * Number(r.amount) });
  });
  db.payrolls.filter(p => p.bankId === bankId).forEach(p => {
    txns.push({ ts: formatTxnTimestamp(p), ref: p.number, type: 'Payroll Disbursement', party: p.employeeName, amount: -Number(p.netPay) });
  });

  txns.sort((a, b) => (b.ts || '').localeCompare(a.ts || ''));

  openModal(`Bank Ledger — ${bank.name}`, `
    <div class="flex justify-between items-center p-3.5 rounded-xl bg-slate-50 border border-slate-200">
      <div>
        <div class="text-xs text-slate-500">${escapeHtml(bank.bankName)} (${escapeHtml(bank.accountNo)})</div>
        <div class="text-xs font-medium text-slate-800 mt-0.5">Recorded Transactions: ${txns.length}</div>
      </div>
      <div class="text-right">
        <div class="text-[11px] text-slate-400">Current Balance</div>
        <div class="text-lg font-semibold text-slate-900">${fmtMoney(bank.balance)}</div>
      </div>
    </div>
    <div class="overflow-x-auto border border-slate-200 rounded-xl">
      <table class="w-full text-xs sm:text-sm text-left">
        <thead class="bg-slate-50 text-[11px] uppercase text-slate-400 border-b border-slate-200">
          <tr><th class="p-3 font-medium">Timestamp</th><th class="p-3 font-medium">Ref #</th><th class="p-3 font-medium">Type</th><th class="p-3 font-medium">Party / Notes</th><th class="p-3 font-medium text-right">Amount</th></tr>
        </thead>
        <tbody class="divide-y divide-slate-100">
          ${txns.length === 0 ? `<tr><td colspan="5" class="p-6 text-center text-slate-400 text-xs">No transactions recorded in this bank yet.</td></tr>` :
            txns.map(t => `
              <tr>
                <td class="p-3 font-mono text-[11px] text-slate-500">${escapeHtml(t.ts)}</td>
                <td class="p-3 font-semibold text-slate-900">${escapeHtml(t.ref)}</td>
                <td class="p-3 text-xs text-slate-600">${escapeHtml(t.type)}</td>
                <td class="p-3 text-slate-700">${escapeHtml(t.party)}</td>
                <td class="p-3 text-right font-semibold ${t.amount >= 0 ? 'text-emerald-700' : 'text-rose-600'}">${t.amount >= 0 ? '+' : ''}${fmtMoney(t.amount)}</td>
              </tr>
            `).join('')}
        </tbody>
      </table>
    </div>
  `, `<button onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-900 text-white text-xs font-medium">Close</button>`, 'max-w-4xl');
}

  tempDepositLines.push({ fromBankId: '', sourceLabel: '', amount: 0 });

function updateDepositTotal() {
  const tot = tempDepositLines.reduce((s, l) => s + (Number(l.amount) || 0), 0);
  const el = document.getElementById('dep-total-display');
  if (el) el.textContent = fmtMoney(tot);
}

function saveDeposit() {
  const number = document.getElementById('dep-num').value.trim();
  const date = document.getElementById('dep-date').value || todayStr();
  const toBankId = document.getElementById('dep-to-bank').value;
  const notes = document.getElementById('dep-notes').value.trim();
  const validLines = tempDepositLines.filter(l => (Number(l.amount) || 0) > 0);
  const total = validLines.reduce((s, l) => s + Number(l.amount), 0);

  if (!toBankId || total <= 0) {
    showToast('Select a destination bank and enter at least one positive amount.', 'error');
    return;
  }

  const toBank = db.banks.find(b => b.id === toBankId);
  if (toBank) toBank.balance = (Number(toBank.balance) || 0) + total;

  validLines.forEach(l => {
    if (l.fromBankId && l.fromBankId !== toBankId) {
      const fb = db.banks.find(b => b.id === l.fromBankId);
      if (fb) fb.balance = (Number(fb.balance) || 0) - Number(l.amount);
    }
  });

  db.deposits.unshift({ id: uid('dep'), number, date, createdAt: nowTimestamp(), toBankId, lines: validLines, total, notes });
  commitDocNumber('deposit', number);
  saveDatabase();
  closeModal();
  renderCurrentView();
  showToast('Bank deposit recorded!');
}

  const number = document.getElementById('trf-num').value.trim();

  const toBankId = document.getElementById('trf-to').value;

  const notes = document.getElementById('trf-notes').value.trim();

  if (fromBankId === toBankId) {
    showToast('Source and destination bank accounts must be different.', 'error');
    return;
  }
  if (amount <= 0) {
    showToast('Enter a valid transfer amount greater than zero.', 'error');
    return;
  }

  const fb = db.banks.find(b => b.id === fromBankId);
  const tb = db.banks.find(b => b.id === toBankId);
  if (fb) fb.balance = (Number(fb.balance) || 0) - amount;
  if (tb) tb.balance = (Number(tb.balance) || 0) + amount;

  db.transfers.unshift({ id: uid('trf'), number, date, createdAt: nowTimestamp(), fromBankId, toBankId, amount, notes });
  commitDocNumber('transfer', number);
  saveDatabase();
  closeModal();
  renderCurrentView();
  showToast('Bank transfer completed!');
}

// 4. INFINITE MULTI-HIERARCHY INVENTORY & AUTO-MARKUP PRICING

function getCategoryPath(catId) {
  if (!catId) return 'Uncategorized';
  const parts = [];
  let curr = db.categories.find(c => c.id === catId);
  let guard = 0;
  while (curr && guard < 25) {
    parts.unshift(curr.name);
    curr = curr.parentId ? db.categories.find(c => c.id === curr.parentId) : null;
    guard++;
  }
  return parts.length ? parts.join(' › ') : 'Uncategorized';
}

function getDescendantCategoryIds(catId) {
  const result = [catId];
  const children = db.categories.filter(c => c.parentId === catId);
  children.forEach(ch => result.push(...getDescendantCategoryIds(ch.id)));
  return result;
}

let selectedInventoryCatFilter = 'ALL';

function renderInventoryView() {
  const q = searchQueries['inventory'] || '';
  const allowedCats = selectedInventoryCatFilter === 'ALL' ? null : getDescendantCategoryIds(selectedInventoryCatFilter);

  const filteredItems = db.items.filter(itm => {
    const path = getCategoryPath(itm.categoryId);
    const catMatch = !allowedCats || allowedCats.includes(itm.categoryId);
    return catMatch && fuzzyMatch(q, itm.code, itm.name, path, itm.unit);
  });

  function renderCatTree(parentId = null, depth = 0) {
    const nodes = db.categories.filter(c => (c.parentId || null) === parentId);
    return nodes.map(node => {
      const children = db.categories.filter(c => c.parentId === node.id);
      const isCollapsed = !!collapsedCategories[node.id];
      const isSelected = selectedInventoryCatFilter === node.id;
      const itemCount = db.items.filter(i => getDescendantCategoryIds(node.id).includes(i.categoryId)).length;

      return `
        <div>
          <div style="padding-left: ${depth * 14 + 8}px" class="group flex items-center justify-between py-1.5 pr-2 rounded-lg text-xs transition ${isSelected ? 'bg-slate-900 text-white font-medium' : 'text-slate-700 hover:bg-slate-100'}">

              ` : `<span class="w-4 text-center opacity-40">•</span>`}

              +Sub
            </button>
          </div>
          ${!isCollapsed && children.length > 0 ? renderCatTree(node.id, depth + 1) : ''}
        </div>
      `;
    }).join('');
  }

  return `
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
      ${renderSearchBar('inv-item-search', q, 'Smart search by item code, name, category path...', 'onInvSearch', 'clearInvSearch')}
      <div class="flex flex-wrap gap-2">
        <button onclick="openCategoryModal(null)" class="px-3.5 py-2 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-xs font-medium">+ Root Category</button>
        <button onclick="openItemModal()" class="px-4 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-medium">+ Add Inventory Item</button>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
      <!-- Infinite Hierarchy Sidebar -->
      <div class="lg:col-span-4 xl:col-span-3 bg-white rounded-2xl border border-slate-200 p-4 h-fit">
        <div class="flex items-center justify-between pb-2.5 mb-2 border-b border-slate-100">
          <span class="text-[11px] font-semibold uppercase tracking-wider text-slate-400">Category Tree</span>
          <button onclick="selectedInventoryCatFilter='ALL'; renderCurrentView();" class="text-[11px] text-slate-600 font-medium hover:underline">Show All</button>
        </div>
        <div onclick="selectedInventoryCatFilter='ALL'; renderCurrentView();" class="cursor-pointer px-2.5 py-1.5 rounded-lg text-xs mb-1 ${selectedInventoryCatFilter === 'ALL' ? 'bg-slate-900 text-white font-medium' : 'text-slate-700 hover:bg-slate-100'}">
          All Inventory Items (${db.items.length})
        </div>
        <div class="space-y-0.5 max-h-[60vh] overflow-y-auto">
          ${db.categories.length === 0 ? `<p class="text-xs text-slate-400 p-2">No categories yet.</p>` : renderCatTree(null, 0)}
        </div>
      </div>

      <!-- Items Table -->
      <div class="lg:col-span-8 xl:col-span-9 bg-white rounded-2xl border border-slate-200 overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-xs sm:text-sm text-left">

                <th class="p-3.5 font-medium">Code</th>

                    <td class="p-3.5 text-right font-semibold ${itm.stock <= 5 ? 'text-rose-600' : 'text-slate-800'}">${fmtNum(itm.stock)} <span class="text-xs font-normal text-slate-400">${escapeHtml(itm.unit || 'pc')}</span></td>
                    <td class="p-3.5 text-right text-slate-500">${fmtMoney(itm.cost)}</td>

      </div>

  `;
}

        </select>

      </div>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Unit Cost (₱) *</label>
        <input id="itm-cost" type="number" step="0.01" value="${itm ? itm.cost : 0}" oninput="calcItemAutoMarkup('cost')" class="w-full px-3 py-2 border border-slate-200 rounded-xl font-semibold text-sm" />
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Auto Markup Percentage (%)</label>
        <input id="itm-markup" type="number" step="0.01" value="${itm ? itm.markup : 20}" oninput="calcItemAutoMarkup('markup')" class="w-full px-3 py-2 border border-slate-200 bg-slate-50 rounded-xl font-semibold text-slate-900 text-sm" />
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Selling Price (₱) — Auto-Calculated</label>
        <input id="itm-price" type="number" step="0.01" value="${itm ? itm.price : 0}" oninput="calcItemAutoMarkup('price')" class="w-full px-3 py-2 border border-slate-300 bg-slate-50 rounded-xl font-semibold text-slate-900 text-sm" />
      </div>
    </div>

    <button onclick="closeModal()" class="px-4 py-2 rounded-xl border border-slate-200 text-xs">Cancel</button>
    <button onclick="saveInventoryItem('${itemId || ''}')" class="px-4 py-2 rounded-xl bg-slate-900 text-white text-xs font-medium">Save Item</button>
  `);
}

function calcItemAutoMarkup(source) {
  const cost = parseFloat(document.getElementById('itm-cost').value) || 0;
  const markupEl = document.getElementById('itm-markup');
  const priceEl = document.getElementById('itm-price');

  if (source === 'cost' || source === 'markup') {
    const markup = parseFloat(markupEl.value) || 0;
    const price = cost * (1 + markup / 100);
    priceEl.value = price.toFixed(2);
  } else if (source === 'price') {
    const price = parseFloat(priceEl.value) || 0;
    const markup = cost > 0 ? ((price - cost) / cost) * 100 : 0;
    markupEl.value = markup.toFixed(2);
  }
}

function saveInventoryItem(itemId) {
  const code = document.getElementById('itm-code').value.trim();
  const name = document.getElementById('itm-name').value.trim();
  const unit = document.getElementById('itm-unit').value.trim() || 'Pc';
  const categoryId = document.getElementById('itm-cat').value || null;
  const stock = parseFloat(document.getElementById('itm-stock').value) || 0;
  const cost = parseFloat(document.getElementById('itm-cost').value) || 0;
  const markup = parseFloat(document.getElementById('itm-markup').value) || 0;
  const price = parseFloat(document.getElementById('itm-price').value) || 0;

  if (!code || !name) {
    showToast('Item Code and Name are required.', 'error');
    return;
  }
  if (itemId) {
    const idx = db.items.findIndex(i => i.id === itemId);
    if (idx >= 0) db.items[idx] = { ...db.items[idx], code, name, unit, categoryId, stock, cost, markup, price };
  } else {
    db.items.push({ id: uid('itm'), code, name, unit, categoryId, stock, cost, markup, price });
  }
  saveDatabase();
  closeModal();
  renderCurrentView();
  showToast('Inventory item saved.');
}

function openAccountTransactionsModal(type, id) {
  let title = '';
  let subtitle = '';
  const txns = [];

  if (type === 'customer') {
    const c = db.customers.find(x => x.id === id);
    if (!c) return;
    title = `Customer Ledger — ${c.name}`;
    subtitle = `TIN: ${c.tin || 'N/A'} | Contact: ${c.contact || 'N/A'} | Address: ${c.address || 'N/A'}`;
    db.estimates.filter(e => e.customerId === id).forEach(e => txns.push({ ts: formatTxnTimestamp(e), num: e.number, kind: 'Estimate', status: e.status, amount: e.total }));
    db.invoices.filter(i => i.customerId === id).forEach(i => txns.push({ ts: formatTxnTimestamp(i), num: i.number, kind: 'Invoice', status: i.status, amount: i.total }));
    db.paymentsReceived.filter(p => p.customerId === id).forEach(p => txns.push({ ts: formatTxnTimestamp(p), num: p.number, kind: 'Payment Received', status: 'Paid', amount: -p.amount }));
    db.refunds.filter(r => r.partyId === id).forEach(r => txns.push({ ts: formatTxnTimestamp(r), num: r.number, kind: 'Customer Refund', status: 'Refunded', amount: r.amount }));
  } else if (type === 'vendor') {
    const v = db.vendors.find(x => x.id === id);
    if (!v) return;
    title = `Vendor Ledger — ${v.name}`;
    subtitle = `TIN: ${v.tin || 'N/A'} | Contact: ${v.contact || 'N/A'} | Address: ${v.address || 'N/A'}`;
    db.purchaseOrders.filter(p => p.vendorId === id).forEach(p => txns.push({ ts: formatTxnTimestamp(p), num: p.number, kind: 'Purchase Order', status: p.status, amount: p.total }));
    db.bills.filter(b => b.vendorId === id).forEach(b => txns.push({ ts: formatTxnTimestamp(b), num: b.number, kind: 'Vendor Bill', status: b.status, amount: b.total }));
    db.billPayments.filter(bp => bp.vendorId === id).forEach(bp => txns.push({ ts: formatTxnTimestamp(bp), num: bp.number, kind: 'Bill Payment', status: 'Paid', amount: -bp.amount }));
    db.expenses.filter(e => e.vendorId === id).forEach(e => txns.push({ ts: formatTxnTimestamp(e), num: e.number, kind: 'Direct Expense', status: 'Paid', amount: e.amount }));
  } else if (type === 'expense') {
    const ea = db.expenseAccounts.find(x => x.id === id);
    if (!ea) return;
    title = `Expense Account History — ${ea.name}`;
    subtitle = `Code: ${ea.code || 'N/A'} | ${ea.description || ''}`;
    db.expenses.filter(e => e.expenseAccountId === id).forEach(e => txns.push({ ts: formatTxnTimestamp(e), num: e.number, kind: `Direct Expense (${e.payee || 'Cash'})`, status: 'Paid', amount: e.amount }));
    db.bills.filter(b => b.expenseAccountId === id).forEach(b => txns.push({ ts: formatTxnTimestamp(b), num: b.number, kind: `Vendor Bill (${b.vendorName})`, status: b.status, amount: b.total }));
  }

  txns.sort((a, b) => (b.ts || '').localeCompare(a.ts || ''));

  openModal(title, `
    <div class="p-3 rounded-xl bg-slate-50 border border-slate-200 text-xs text-slate-600">${escapeHtml(subtitle)}</div>
    <div class="overflow-x-auto border border-slate-200 rounded-xl">
      <table class="w-full text-xs sm:text-sm text-left">
        <thead class="bg-slate-50 text-[11px] uppercase text-slate-400 border-b border-slate-200">
          <tr><th class="p-3 font-medium">Timestamp</th><th class="p-3 font-medium">Ref #</th><th class="p-3 font-medium">Transaction Type</th><th class="p-3 font-medium">Status</th><th class="p-3 font-medium text-right">Amount</th></tr>
        </thead>
        <tbody class="divide-y divide-slate-100">
          ${txns.length === 0 ? `<tr><td colspan="5" class="p-6 text-center text-slate-400 text-xs">No transactions recorded for this account yet.</td></tr>` :
            txns.map(t => `
              <tr>
                <td class="p-3 font-mono text-[11px] text-slate-500">${escapeHtml(t.ts)}</td>
                <td class="p-3 font-semibold text-slate-900">${escapeHtml(t.num)}</td>
                <td class="p-3 text-slate-700">${escapeHtml(t.kind)}</td>
                <td class="p-3"><span class="px-2 py-0.5 rounded-md text-[11px] bg-slate-100 text-slate-700">${escapeHtml(t.status)}</span></td>
                <td class="p-3 text-right font-semibold text-slate-900">${fmtMoney(t.amount)}</td>
              </tr>
            `).join('')}
        </tbody>
      </table>
    </div>
  `, `<button onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-900 text-white text-xs font-medium">Close</button>`, 'max-w-4xl');
}

let gridRows = [];
let activeDocMode = 'invoice'; // 'invoice' | 'estimate' | 'po' | 'bill'
let selectedRecipientId = '';

function onRecipientSearchInput(val) {
  selectedRecipientId = '';
  const box = document.getElementById('doc-recipient-suggest');
  const clearBtn = document.getElementById('doc-recipient-clear');
  if (clearBtn) clearBtn.classList.toggle('hidden', !val);
  if (!box) return;

  const isSales = activeDocMode === 'invoice' || activeDocMode === 'estimate';
  const pool = isSales ? db.customers : db.vendors;
  const matches = pool.filter(p => fuzzyMatch(val, p.name, p.tin, p.contact, p.address)).slice(0, 10);

  if (matches.length === 0) {
    box.classList.add('hidden');
    return;
  }

  box.innerHTML = matches.map(m => `
    <div onmousedown="selectSmartRecipient('${m.id}')" class="px-3.5 py-2.5 hover:bg-slate-50 cursor-pointer border-b border-slate-100 last:border-0 flex items-center justify-between gap-3 transition">
      <div class="min-w-0">
        <div class="font-semibold text-slate-900 text-xs sm:text-sm truncate">${escapeHtml(m.name)}</div>
        <div class="text-[11px] text-slate-400 truncate">
          ${m.tin ? `<span class="font-mono text-slate-600">TIN: ${escapeHtml(m.tin)}</span>` : 'No TIN'}
          ${m.contact ? ` • ${escapeHtml(m.contact)}` : ''}
          ${m.address ? ` • ${escapeHtml(m.address)}` : ''}
        </div>
      </div>
      <span class="text-[10px] font-medium px-2 py-0.5 rounded-md bg-slate-100 text-slate-700 shrink-0">Select</span>
    </div>
  `).join('');
  box.classList.remove('hidden');
}

function hideRecipientSuggest() {
  const box = document.getElementById('doc-recipient-suggest');
  if (box) box.classList.add('hidden');
}

function selectSmartRecipient(partyId) {
  const isSales = activeDocMode === 'invoice' || activeDocMode === 'estimate';
  const pool = isSales ? db.customers : db.vendors;
  const p = pool.find(x => x.id === partyId);
  if (!p) return;

  selectedRecipientId = p.id;
  const nameEl = document.getElementById('doc-recip-name');
  const tinEl = document.getElementById('doc-recip-tin');

function renderExcelGridRows() {
  const tbody = document.getElementById('excel-grid-body');
  if (!tbody) return;
  const isSales = activeDocMode === 'invoice' || activeDocMode === 'estimate';

  tbody.innerHTML = gridRows.map((row, rIdx) => {
    const unitVal = isSales ? (row.price ?? 0) : (row.cost ?? 0);
    return `
      <tr class="border-b border-slate-200 relative">
        <td class="p-1.5 border-r border-slate-200 text-center text-slate-400 bg-slate-50 font-mono">${rIdx + 1}</td>
        <td class="p-0 border-r border-slate-200">
          <input
            data-row="${rIdx}" data-col="0"
            value="${escapeHtml(row.code || '')}"
            oninput="onGridCellInput(${rIdx}, 'code', this.value)"
            onkeydown="onGridKeyDown(event, ${rIdx}, 0)"
            placeholder="SKU"
            class="excel-cell w-full px-2 py-2 font-mono text-xs bg-transparent"
          />
        </td>
        <td class="p-0 border-r border-slate-200 relative">
          <input
            id="grid-name-${rIdx}"
            data-row="${rIdx}" data-col="1"
            value="${escapeHtml(row.name || '')}"
            oninput="onGridItemSearch(${rIdx}, this.value)"
            onfocus="onGridItemSearch(${rIdx}, this.value)"
            onblur="setTimeout(()=>hideGridSuggest(${rIdx}), 180)"
            onkeydown="onGridKeyDown(event, ${rIdx}, 1)"
            placeholder="Type item name or code to suggest..."
            autocomplete="off"
            class="excel-cell w-full px-2 py-2 text-xs bg-transparent"
          />
          <div id="grid-suggest-${rIdx}" class="hidden absolute left-0 top-full z-50 w-full min-w-[290px] bg-white border border-slate-200 rounded-xl shadow-xl max-h-48 overflow-y-auto"></div>
        </td>
        <td class="p-0 border-r border-slate-200">
          <input
            data-row="${rIdx}" data-col="2"
            type="number" step="0.01"
            value="${row.qty}"
            oninput="onGridCellInput(${rIdx}, 'qty', this.value)"
            onkeydown="onGridKeyDown(event, ${rIdx}, 2)"
            class="excel-cell w-full px-2 py-2 text-xs text-right bg-transparent"
          />
        </td>
        <td class="p-0 border-r border-slate-200">
          <input
            data-row="${rIdx}" data-col="3"
            type="number" step="0.01"
            value="${unitVal}"
            oninput="onGridCellInput(${rIdx}, 'rate', this.value)"
            onkeydown="onGridKeyDown(event, ${rIdx}, 3)"
            class="excel-cell w-full px-2 py-2 text-xs text-right bg-transparent"
          />
        </td>
        <td id="grid-total-${rIdx}" class="px-2 py-2 border-r border-slate-200 text-right font-semibold text-slate-900 bg-slate-50/50">
          ${fmtMoney(row.total)}
        </td>
        <td class="p-1 text-center">
          ${gridRows.length > 1 ? `<button type="button" tabindex="-1" onclick="gridRows.splice(${rIdx},1); renderExcelGridRows();" class="text-slate-400 hover:text-rose-600 font-bold">✕</button>` : ''}
        </td>
      </tr>
    `;
  }).join('');
  updateDocGrandTotal();
}

function onGridItemSearch(rIdx, val) {
  gridRows[rIdx].name = val;
  const box = document.getElementById(`grid-suggest-${rIdx}`);
  if (!box) return;

  const isSales = activeDocMode === 'invoice' || activeDocMode === 'estimate';
  const matches = db.items.filter(itm => fuzzyMatch(val, itm.code, itm.name, getCategoryPath(itm.categoryId))).slice(0, 8);
  if (matches.length === 0) {
    box.classList.add('hidden');
    return;
  }

  box.innerHTML = matches.map(m => {
    const rate = isSales ? m.price : m.cost;
    return `
      <div onmousedown="selectSuggestedItem(${rIdx}, '${m.id}')" class="px-3 py-2 hover:bg-slate-50 cursor-pointer border-b border-slate-100 last:border-0 flex items-center justify-between gap-2">
        <div class="min-w-0">
          <div class="font-medium text-slate-900 truncate"><span class="font-mono text-slate-500">[${escapeHtml(m.code)}]</span> ${escapeHtml(m.name)}</div>
          <div class="text-[10px] text-slate-400">Stock: ${fmtNum(m.stock)} ${escapeHtml(m.unit)} • ${isSales ? 'Sell Price' : 'Unit Cost'}</div>
        </div>
        <div class="font-semibold text-slate-900 shrink-0">${fmtMoney(rate)}</div>
      </div>
    `;
  }).join('');
  box.classList.remove('hidden');
}

function hideGridSuggest(rIdx) {
  const box = document.getElementById(`grid-suggest-${rIdx}`);
  if (box) box.classList.add('hidden');
}

function selectSuggestedItem(rIdx, itemId) {
  const itm = db.items.find(i => i.id === itemId);
  if (!itm) return;
  const isSales = activeDocMode === 'invoice' || activeDocMode === 'estimate';
  const qty = Number(gridRows[rIdx].qty) || 1;
  const rate = isSales ? (Number(itm.price) || 0) : (Number(itm.cost) || 0);

  gridRows[rIdx] = {
    itemId: itm.id,
    code: itm.code,
    name: itm.name,
    qty,
    price: isSales ? rate : 0,
    cost: isSales ? 0 : rate,
    total: qty * rate
  };
  renderExcelGridRows();
  setTimeout(() => {
    const qtyCell = document.querySelector(`[data-row="${rIdx}"][data-col="2"]`);
    if (qtyCell) { qtyCell.focus(); qtyCell.select(); }
  }, 20);
}

function onGridCellInput(rIdx, field, val) {
  const isSales = activeDocMode === 'invoice' || activeDocMode === 'estimate';
  if (field === 'code') gridRows[rIdx].code = val;
  if (field === 'qty') gridRows[rIdx].qty = parseFloat(val) || 0;
  if (field === 'rate') {
    const numVal = parseFloat(val) || 0;
    if (isSales) gridRows[rIdx].price = numVal;
    else gridRows[rIdx].cost = numVal;
  }
  const rate = isSales ? (Number(gridRows[rIdx].price) || 0) : (Number(gridRows[rIdx].cost) || 0);
  gridRows[rIdx].total = (Number(gridRows[rIdx].qty) || 0) * rate;

  const cellEl = document.getElementById(`grid-total-${rIdx}`);
  if (cellEl) cellEl.textContent = fmtMoney(gridRows[rIdx].total);
  updateDocGrandTotal();
}

function onGridKeyDown(e, rIdx, cIdx) {
  if (e.key === 'Tab' && !e.shiftKey) {
    e.preventDefault();
    hideGridSuggest(rIdx);
    if (cIdx < 3) {
      const next = document.querySelector(`[data-row="${rIdx}"][data-col="${cIdx + 1}"]`);
      if (next) { next.focus(); next.select?.(); }
    } else {
      if (rIdx === gridRows.length - 1) {
        addExcelGridRow(true);
      } else {
        const nextRowCell = document.querySelector(`[data-row="${rIdx + 1}"][data-col="1"]`);
        if (nextRowCell) { nextRowCell.focus(); nextRowCell.select?.(); }
      }
    }
  }
}

function addExcelGridRow(focusNew = false) {
  gridRows.push({ itemId: '', code: '', name: '', qty: 1, price: 0, cost: 0, total: 0 });
  renderExcelGridRows();
  if (focusNew) {
    const newIdx = gridRows.length - 1;
    setTimeout(() => {
      const cell = document.querySelector(`[data-row="${newIdx}"][data-col="1"]`);
      if (cell) cell.focus();
    }, 20);
  }
}

function updateDocGrandTotal() {
  const tot = gridRows.reduce((s, r) => s + (Number(r.total) || 0), 0);
  const el = document.getElementById('doc-grand-total');
  if (el) el.textContent = fmtMoney(tot);
}

function saveSalesDocument(fromEstimateId = '') {
  const number = document.getElementById('sdoc-num').value.trim();
  const date = document.getElementById('sdoc-date').value || todayStr();
  const dueDate = document.getElementById('sdoc-due').value || '';
  const customerName = document.getElementById('doc-recip-name').value.trim();
  const customerTin = document.getElementById('doc-recip-tin').value.trim();
  const customerAddress = document.getElementById('doc-recip-addr').value.trim();
  const customerContact = document.getElementById('doc-recip-contact').value.trim();
  const notes = document.getElementById('sdoc-notes').value.trim();

  if (!customerName) {
    showToast('Customer Name is required!', 'error');
    return;
  }

  const validItems = gridRows.filter(r => r.name.trim() && (Number(r.qty) || 0) > 0);
  if (validItems.length === 0) {
    showToast('Add at least one line item with quantity > 0.', 'error');
    return;
  }

  let customerId = selectedRecipientId;
  if (!customerId) {
    const existing = db.customers.find(c => c.name.toLowerCase() === customerName.toLowerCase());
    if (existing) {
      customerId = existing.id;
    } else {
      const newCust = { id: uid('cust'), name: customerName, tin: customerTin, address: customerAddress, contact: customerContact };
      db.customers.push(newCust);
      customerId = newCust.id;
    }
  }

  const total = validItems.reduce((s, r) => s + (Number(r.total) || 0), 0);
  const createdAt = nowTimestamp();

  if (activeDocMode === 'invoice') {
    validItems.forEach(line => {
      if (line.itemId) {
        const itm = db.items.find(i => i.id === line.itemId);
        if (itm) itm.stock = (Number(itm.stock) || 0) - (Number(line.qty) || 0);
      }
    });

    db.invoices.unshift({
      id: uid('inv'), number, date, createdAt, dueDate,
      customerId, customerName, customerTin, customerAddress, customerContact,
      status: 'Unpaid', paidAmount: 0, notes, items: validItems, total
    });
    commitDocNumber('invoice', number);

    if (fromEstimateId) {
      const est = db.estimates.find(e => e.id === fromEstimateId);
      if (est) est.status = 'Converted';
    }
    showToast(`Invoice ${number} created.`);
  } else {
    db.estimates.unshift({
      id: uid('est'), number, date, createdAt, expiryDate: dueDate,
      customerId, customerName, customerTin, customerAddress, customerContact,
      status: 'Open', notes, items: validItems, total
    });
    commitDocNumber('estimate', number);
    showToast(`Estimate ${number} created.`);
  }

  saveDatabase();
  closeModal();
  renderCurrentView();
}

function convertEstimateToInvoice(estId) {
  const est = db.estimates.find(e => e.id === estId);
  if (!est) return;
  navigate('invoices');
  setTimeout(() => {
    openInvoiceModal({
      fromEstimateId: est.id,
      customerId: est.customerId,
      customerName: est.customerName,
      customerTin: est.customerTin,
      customerAddress: est.customerAddress,
      customerContact: est.customerContact,
      notes: `Converted from ${est.number}. ${est.notes || ''}`,
      items: est.items
    });
  }, 60);
}

function updateRefundParties() {
  const type = document.getElementById('rf-type').value;

  sel.innerHTML = list.map(p => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('');
}

function saveRefund() {
  const number = document.getElementById('rf-num').value.trim();
  const date = document.getElementById('rf-date').value || todayStr();
  const refundType = document.getElementById('rf-type').value;
  const partyId = document.getElementById('rf-party').value;
  const bankId = document.getElementById('rf-bank').value;
  const amount = parseFloat(document.getElementById('rf-amt').value) || 0;
  const notes = document.getElementById('rf-notes').value.trim();

  if (amount <= 0) { showToast('Enter a valid refund amount.', 'error'); return; }
  const partyList = refundType === 'Customer Refund' ? db.customers : db.vendors;
  const partyName = partyList.find(p => p.id === partyId)?.name || 'Walk-in';

  const bank = db.banks.find(b => b.id === bankId);
  if (bank) {
    bank.balance += refundType === 'Customer Refund' ? -amount : amount;
  }

  db.refunds.unshift({ id: uid('rfnd'), number, date, createdAt: nowTimestamp(), refundType, partyId, partyName, bankId, amount, notes });
  commitDocNumber('refund', number);
  saveDatabase();
  closeModal();
  renderCurrentView();
  showToast('Refund recorded.');
}

function savePurchaseDocument(fromPOId = '') {
  const number = document.getElementById('pdoc-num').value.trim();
  const date = document.getElementById('pdoc-date').value || todayStr();
  const dueOrExpDate = document.getElementById('pdoc-due').value || todayStr();
  const vendorName = document.getElementById('doc-recip-name').value.trim();
  const vendorTin = document.getElementById('doc-recip-tin').value.trim();
  const vendorAddress = document.getElementById('doc-recip-addr').value.trim();
  const vendorContact = document.getElementById('doc-recip-contact').value.trim();
  const notes = document.getElementById('pdoc-notes').value.trim();

  if (!vendorName) {
    showToast('Vendor Name is required!', 'error');
    return;
  }

  const validItems = gridRows.filter(r => r.name.trim() && (Number(r.qty) || 0) > 0).map(r => ({
    itemId: r.itemId || '',
    code: r.code || '',
    name: r.name.trim(),
    description: r.name.trim(),
    qty: Number(r.qty) || 0,
    cost: Number(r.cost) || 0,
    total: Number(r.total) || 0
  }));

  if (validItems.length === 0) {
    showToast('Add at least one line item with quantity > 0.', 'error');
    return;
  }

  let vendorId = selectedRecipientId;
  if (!vendorId) {
    const existing = db.vendors.find(v => v.name.toLowerCase() === vendorName.toLowerCase());
    if (existing) {
      vendorId = existing.id;
    } else {
      const newVend = { id: uid('vend'), name: vendorName, tin: vendorTin, address: vendorAddress, contact: vendorContact };
      db.vendors.push(newVend);
      vendorId = newVend.id;
    }
  }

  const total = validItems.reduce((s, l) => s + Number(l.total), 0);
  const createdAt = nowTimestamp();

  if (activeDocMode === 'bill') {
    const expenseAccountId = document.getElementById('pdoc-exp-acc')?.value || '';
    validItems.forEach(line => {
      if (line.itemId) {
        const itm = db.items.find(i => i.id === line.itemId);
        if (itm) {
          itm.stock = (Number(itm.stock) || 0) + (Number(line.qty) || 0);
          if (line.cost > 0) itm.cost = Number(line.cost);
        }
      }
    });

    db.bills.unshift({
      id: uid('bill'), number, date, createdAt, dueDate: dueOrExpDate,
      vendorId, vendorName, vendorTin, vendorAddress, vendorContact,
      expenseAccountId, status: 'Unpaid', paidAmount: 0, notes, items: validItems, total
    });
    commitDocNumber('bill', number);

    if (fromPOId) {
      const po = db.purchaseOrders.find(p => p.id === fromPOId);
      if (po) po.status = 'Billed';
    }
    showToast(`Vendor bill ${number} saved.`);
  } else {
    db.purchaseOrders.unshift({
      id: uid('po'), number, date, createdAt, expectedDate: dueOrExpDate,
      vendorId, vendorName, vendorTin, vendorAddress, vendorContact,
      status: 'Open', notes, items: validItems, total
    });
    commitDocNumber('po', number);
    showToast(`Purchase Order ${number} created.`);
  }

  saveDatabase();
  closeModal();
  renderCurrentView();
}

function convertPOToBill(poId) {
  const po = db.purchaseOrders.find(p => p.id === poId);
  if (!po) return;
  navigate('enter-bills');

function onSelectBillToPay(billId) {
  const b = db.bills.find(x => x.id === billId);
  if (!b) return;
  const bal = Math.max(0, Number(b.total) - (Number(b.paidAmount) || 0));
  document.getElementById('pb-amt').value = bal.toFixed(2);
}

function savePayBill() {
  const number = document.getElementById('pb-num').value.trim();
  const date = document.getElementById('pb-date').value || todayStr();
  const billId = document.getElementById('pb-bill').value;
  const bankId = document.getElementById('pb-bank').value;
  const amount = parseFloat(document.getElementById('pb-amt').value) || 0;
  const notes = document.getElementById('pb-notes').value.trim();

  const bill = db.bills.find(b => b.id === billId);
  if (!bill || amount <= 0) {
    showToast('Select a bill and enter a valid payment amount.', 'error');
    return;
  }

  bill.paidAmount = (Number(bill.paidAmount) || 0) + amount;
  bill.status = bill.paidAmount >= bill.total - 0.009 ? 'Paid' : 'Partial';

  const bank = db.banks.find(b => b.id === bankId);
  if (bank) bank.balance = (Number(bank.balance) || 0) - amount;

  db.billPayments.unshift({
    id: uid('bp'), number, date, createdAt: nowTimestamp(), billId: bill.id, billNumber: bill.number,
    vendorId: bill.vendorId, vendorName: bill.vendorName, bankId, amount, notes
  });

  commitDocNumber('billPayment', number);
  saveDatabase();
  closeModal();
  renderCurrentView();
  showToast(`Bill payment ${number} recorded.`);
}
