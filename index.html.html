        <input id="emp-allow" type="number" step="0.01" value="${e ? e.allowance : 1500}" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm" />
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Standard Deductions (SSS/PhilHealth/Tax)</label>
        <input id="emp-ded" type="number" step="0.01" value="${e ? e.deductions : 1000}" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm" />
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">TIN Number</label>
        <input id="emp-tin" value="${escapeHtml(e?.tin || '')}" class="w-full px-3 py-2 border border-slate-200 rounded-xl font-mono text-sm" />
      </div>
    </div>
  `, `
    <button onclick="closeModal()" class="px-4 py-2 rounded-xl border border-slate-200 text-xs">Cancel</button>
    <button onclick="saveEmployee('${id || ''}')" class="px-4 py-2 rounded-xl bg-slate-900 text-white text-xs font-medium">Save Employee</button>
  `);
}

function saveEmployee(id) {
  const name = document.getElementById('emp-name').value.trim();
  const position = document.getElementById('emp-pos').value.trim();
  const basicPay = parseFloat(document.getElementById('emp-basic').value) || 0;
  const allowance = parseFloat(document.getElementById('emp-allow').value) || 0;
  const deductions = parseFloat(document.getElementById('emp-ded').value) || 0;
  const tin = document.getElementById('emp-tin').value.trim();

  if (!name) { showToast('Employee name is required.', 'error'); return; }
  if (id) {
    const idx = db.employees.findIndex(x => x.id === id);
    if (idx >= 0) db.employees[idx] = { ...db.employees[idx], name, position, basicPay, allowance, deductions, tin };
  } else {
    db.employees.push({ id: uid('emp'), name, position, basicPay, allowance, deductions, tin, sss: '' });
  }
  saveDatabase();
  closeModal();
  renderCurrentView();
  showToast('Employee saved.');
}

function openRunPayrollModal() {
  if (db.employees.length === 0) {
    showToast('Add an employee first before generating payroll.', 'error');
    return;
  }
  const nextNo = formatDocNumber(db.sequences.payroll);
  const firstEmp = db.employees[0];

  openModal('Generate Employee Payroll & Payslip', `
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Payslip #</label>
        <input id="pr-num" value="${escapeHtml(nextNo)}" class="w-full px-3 py-2 border border-slate-200 rounded-xl font-mono text-sm" />
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Pay Date</label>
        <input id="pr-date" type="date" value="${todayStr()}" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm" />
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Select Employee *</label>
        <select id="pr-emp" onchange="onSelectPayrollEmp(this.value)" class="w-full px-3 py-2 border border-slate-200 rounded-xl bg-white text-sm">
          ${db.employees.map(e => `<option value="${e.id}">${escapeHtml(e.name)} (${escapeHtml(e.position)})</option>`).join('')}
        </select>
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Pay Period</label>
        <input id="pr-period" value="Nov 1 - Nov 15, 2026" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm" />
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Basic Pay (₱)</label>
        <input id="pr-basic" type="number" step="0.01" value="${(firstEmp.basicPay / 2).toFixed(2)}" oninput="calcPayrollNet()" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm" />
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Allowance / Overtime (₱)</label>
        <input id="pr-allow" type="number" step="0.01" value="${(firstEmp.allowance / 2).toFixed(2)}" oninput="calcPayrollNet()" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm" />
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Deductions (₱)</label>
        <input id="pr-ded" type="number" step="0.01" value="${(firstEmp.deductions / 2).toFixed(2)}" oninput="calcPayrollNet()" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm" />
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Disburse From Bank *</label>
        <select id="pr-bank" class="w-full px-3 py-2 border border-slate-200 rounded-xl bg-white text-sm">
          ${db.banks.map(b => `<option value="${b.id}">${escapeHtml(b.name)}</option>`).join('')}
        </select>
      </div>
      <div class="sm:col-span-2 p-3.5 rounded-xl bg-slate-50 border border-slate-200 flex justify-between items-center">
        <span class="text-xs font-semibold text-slate-700">Net Take-Home Pay:</span>
        <span id="pr-net-display" class="text-xl font-semibold text-slate-900">₱0.00</span>
      </div>
    </div>
  `, `
    <button onclick="closeModal()" class="px-4 py-2 rounded-xl border border-slate-200 text-xs">Cancel</button>
    <button onclick="savePayroll()" class="px-4 py-2 rounded-xl bg-slate-900 text-white text-xs font-medium">Post Payroll</button>
  `);
  calcPayrollNet();
}

function onSelectPayrollEmp(empId) {
  const e = db.employees.find(x => x.id === empId);
  if (!e) return;
  document.getElementById('pr-basic').value = (e.basicPay / 2).toFixed(2);
  document.getElementById('pr-allow').value = (e.allowance / 2).toFixed(2);
  document.getElementById('pr-ded').value = (e.deductions / 2).toFixed(2);
  calcPayrollNet();
}

function calcPayrollNet() {
  const b = parseFloat(document.getElementById('pr-basic')?.value) || 0;
  const a = parseFloat(document.getElementById('pr-allow')?.value) || 0;
  const d = parseFloat(document.getElementById('pr-ded')?.value) || 0;
  const el = document.getElementById('pr-net-display');
  if (el) el.textContent = fmtMoney(Math.max(0, b + a - d));
}

function savePayroll() {
  const number = document.getElementById('pr-num').value.trim();
  const date = document.getElementById('pr-date').value || todayStr();
  const employeeId = document.getElementById('pr-emp').value;
  const period = document.getElementById('pr-period').value.trim();
  const basicPay = parseFloat(document.getElementById('pr-basic').value) || 0;
  const allowance = parseFloat(document.getElementById('pr-allow').value) || 0;
  const deductions = parseFloat(document.getElementById('pr-ded').value) || 0;
  const bankId = document.getElementById('pr-bank').value;
  const netPay = Math.max(0, basicPay + allowance - deductions);

  const emp = db.employees.find(e => e.id === employeeId);
  const bank = db.banks.find(b => b.id === bankId);
  if (bank) bank.balance = (Number(bank.balance) || 0) - netPay;

  db.payrolls.unshift({
    id: uid('pr'), number, date, createdAt: nowTimestamp(), period, employeeId,
    employeeName: emp?.name || 'Employee', position: emp?.position || '',
    basicPay, allowance, deductions, netPay, bankId, notes: ''
  });
  commitDocNumber('payroll', number);
  saveDatabase();
  closeModal();
  renderCurrentView();
  showToast(`Payroll ${number} posted.`);
}

// ============================================================================
// 10. INTERACTIVE EDITABLE PRINT PREVIEW ENGINE (PORTRAIT / LANDSCAPE)
// ============================================================================
function buildPrintableHtml(docType, id, orientation = 'portrait') {
  const co = db.company;
  const isLandscape = orientation === 'landscape';
  const pageClass = `print-page ${isLandscape ? 'landscape-page' : ''} bg-white border border-slate-300 shadow-xs mx-auto p-6 text-slate-900 font-sans text-xs`;
  const pageStyle = isLandscape ? 'width: 8.5in; min-height: 5.5in;' : 'width: 5.5in; min-height: 8.5in;';

  const renderHeader = (title, docNum, dateStr, tsStr) => `
    <div style="border-bottom: 1.5px solid #0f172a; padding-bottom: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;">
      <div>
        <div contenteditable="true" style="font-size: 13pt; font-weight: 700; letter-spacing: -0.02em; color: #0f172a;">${escapeHtml(co.name)}</div>
        <div contenteditable="true" style="font-size: 8pt; color: #475569; margin-top: 2px;">${escapeHtml(co.address)}</div>
        <div contenteditable="true" style="font-size: 8pt; color: #475569;">TIN: ${escapeHtml(co.tin)} | Tel: ${escapeHtml(co.contact)}</div>
      </div>
      <div style="text-align: right; shrink: 0;">
        <div contenteditable="true" style="font-size: 11pt; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: #0f172a;">${escapeHtml(title)}</div>
        <div contenteditable="true" style="font-size: 9.5pt; font-weight: 700; font-family: monospace; margin-top: 2px;">No: ${escapeHtml(docNum)}</div>
        <div contenteditable="true" style="font-size: 7.5pt; color: #475569;">Date: ${escapeHtml(dateStr)}</div>
        ${tsStr ? `<div contenteditable="true" style="font-size: 7pt; color: #64748b; font-family: monospace;">Recorded: ${escapeHtml(tsStr)}</div>` : ''}
      </div>
    </div>
  `;

  const renderFooter = (sigLeft = 'Prepared By', sigRight = 'Received / Approved By') => `
    <div style="margin-top: 16px; padding-top: 10px; border-top: 1px solid #94a3b8; display: flex; justify-content: space-between; font-size: 8pt;">
      <div style="width: 44%; text-align: center;">
        <div style="height: 22px; border-bottom: 1px solid #334155; margin-bottom: 3px;"></div>
        <div contenteditable="true">${escapeHtml(sigLeft)}</div>
      </div>
      <div style="width: 44%; text-align: center;">
        <div style="height: 22px; border-bottom: 1px solid #334155; margin-bottom: 3px;"></div>
        <div contenteditable="true">${escapeHtml(sigRight)}</div>
      </div>
    </div>
  `;

  // Profit & Loss Printable Report
  if (docType === 'pnl') {
    const m = calculatePnLMetrics(pnlDateFrom, pnlDateTo);
    return `
      <div class="${pageClass}" style="${pageStyle}">
        <div>
          ${renderHeader('Profit & Loss Statement', `${pnlDateFrom} to ${pnlDateTo}`, todayStr(), nowTimestamp())}
          <table style="width: 100%; border-collapse: collapse; font-size: 8.5pt; margin-top: 6px;">
            <thead>
              <tr style="border-bottom: 1px solid #0f172a; background: #f8fafc;">
                <th style="padding: 5px; text-align: left;">Account / Description</th>
                <th style="padding: 5px; text-align: right; width: 120px;">Amount</th>
              </tr>
            </thead>
            <tbody>
              <tr><td colspan="2" style="padding: 6px 5px 2px; font-weight: 700; text-transform: uppercase; font-size: 7.5pt; color: #475569;">Revenue</td></tr>
              <tr><td contenteditable="true" style="padding: 4px 5px;">Gross Sales Invoiced (${m.rangeInvoices.length} invoices)</td><td contenteditable="true" style="padding: 4px 5px; text-align: right;">${fmtMoney(m.grossSales)}</td></tr>
              <tr><td contenteditable="true" style="padding: 4px 5px;">Less: Customer Refunds & Returns</td><td contenteditable="true" style="padding: 4px 5px; text-align: right;">-${fmtMoney(m.salesReturns)}</td></tr>
              <tr style="background: #f8fafc; font-weight: 700; border-top: 1px solid #cbd5e1; border-bottom: 1px solid #cbd5e1;">
                <td contenteditable="true" style="padding: 5px;">Net Sales Revenue</td>
                <td contenteditable="true" style="padding: 5px; text-align: right;">${fmtMoney(m.netRevenue)}</td>
              </tr>

              <tr><td colspan="2" style="padding: 8px 5px 2px; font-weight: 700; text-transform: uppercase; font-size: 7.5pt; color: #475569;">Cost of Goods Sold</td></tr>
              <tr><td contenteditable="true" style="padding: 4px 5px;">Inventory Cost of Sold Items</td><td contenteditable="true" style="padding: 4px 5px; text-align: right;">${fmtMoney(m.cogs)}</td></tr>
              <tr style="background: #f8fafc; font-weight: 700; border-top: 1px solid #cbd5e1; border-bottom: 1px solid #cbd5e1;">
                <td contenteditable="true" style="padding: 5px;">Gross Profit (${m.grossMarginPct.toFixed(1)}% Margin)</td>
                <td contenteditable="true" style="padding: 5px; text-align: right;">${fmtMoney(m.grossProfit)}</td>
              </tr>

              <tr><td colspan="2" style="padding: 8px 5px 2px; font-weight: 700; text-transform: uppercase; font-size: 7.5pt; color: #475569;">Operating Expenses</td></tr>
              ${m.expenseBreakdown.map(e => `
                <tr>
                  <td contenteditable="true" style="padding: 4px 5px;">${e.code ? `[${escapeHtml(e.code)}] ` : ''}${escapeHtml(e.name)}</td>
                  <td contenteditable="true" style="padding: 4px 5px; text-align: right;">${fmtMoney(e.amount)}</td>
                </tr>
              `).join('')}
              <tr style="background: #f8fafc; font-weight: 700; border-top: 1px solid #cbd5e1;">
                <td contenteditable="true" style="padding: 5px;">Total Operating Expenses</td>
                <td contenteditable="true" style="padding: 5px; text-align: right;">${fmtMoney(m.totalOpEx)}</td>
              </tr>

              <tr style="border-top: 2px solid #0f172a; border-bottom: 2px solid #0f172a; font-weight: 700; font-size: 10pt;">
                <td contenteditable="true" style="padding: 7px 5px;">${m.netProfit >= 0 ? 'NET PROFIT' : 'NET LOSS'}</td>
                <td contenteditable="true" style="padding: 7px 5px; text-align: right;">${fmtMoney(m.netProfit)}</td>
              </tr>
            </tbody>
          </table>
        </div>
        ${renderFooter('Prepared By (Accounting)', 'Approved By (Management)')}
      </div>
    `;
  }

  // Paginated Itemized Documents (Invoice, Estimate, Bill)
  if (docType === 'invoice' || docType === 'estimate' || docType === 'bill') {
    const doc = docType === 'invoice' ? db.invoices.find(x => x.id === id)
              : docType === 'estimate' ? db.estimates.find(x => x.id === id)
              : db.bills.find(x => x.id === id);
    if (!doc) return '';

    const titleMap = { invoice: 'SALES INVOICE', estimate: 'QUOTATION / ESTIMATE', bill: 'SUPPLIER BILL VOUCHER' };
    const partyLabel = docType === 'bill' ? 'Vendor / Supplier' : 'Sold To / Customer';
    const partyName = docType === 'bill' ? doc.vendorName : doc.customerName;
    const partyTin = docType === 'bill' ? doc.vendorTin : doc.customerTin;
    const partyAddr = docType === 'bill' ? doc.vendorAddress : doc.customerAddress;
    const partyContact = docType === 'bill' ? doc.vendorContact : doc.customerContact;

    const ROWS_PER_PAGE = isLandscape ? 8 : 14;
    const items = doc.items || [];
    const chunks = [];
    for (let i = 0; i < items.length; i += ROWS_PER_PAGE) {
      chunks.push(items.slice(i, i + ROWS_PER_PAGE));
    }
    if (chunks.length === 0) chunks.push([]);

    return chunks.map((chunk, pIdx) => {
      const isLast = pIdx === chunks.length - 1;
      return `
        <div class="${pageClass}" style="${pageStyle}">
          <div>
            ${renderHeader(titleMap[docType], doc.number, doc.date, formatTxnTimestamp(doc))}
            <div style="border: 1px solid #cbd5e1; border-radius: 4px; padding: 6px 8px; margin-bottom: 8px; font-size: 8.5pt;">
              <div><strong>${partyLabel}:</strong> <span contenteditable="true">${escapeHtml(partyName)}</span></div>
              ${partyTin ? `<div><strong>TIN:</strong> <span contenteditable="true">${escapeHtml(partyTin)}</span></div>` : ''}
              ${partyAddr ? `<div><strong>Address:</strong> <span contenteditable="true">${escapeHtml(partyAddr)}</span></div>` : ''}
              ${partyContact ? `<div><strong>Contact:</strong> <span contenteditable="true">${escapeHtml(partyContact)}</span></div>` : ''}
            </div>

            <table style="width: 100%; border-collapse: collapse; font-size: 8.5pt;">
              <thead>
                <tr style="border-top: 1px solid #0f172a; border-bottom: 1px solid #0f172a; background: #f8fafc;">
                  <th style="padding: 4px; text-align: left; width: 42px;">Qty</th>
                  <th style="padding: 4px; text-align: left;">Description</th>
                  <th style="padding: 4px; text-align: right; width: 78px;">Unit Price</th>
                  <th style="padding: 4px; text-align: right; width: 88px;">Amount</th>
                </tr>
              </thead>
              <tbody>
                ${chunk.map(line => {
                  const rate = docType === 'bill' ? line.cost : line.price;
                  return `
                    <tr style="border-bottom: 1px solid #e2e8f0;">
                      <td contenteditable="true" style="padding: 4px;">${fmtNum(line.qty)}</td>
                      <td contenteditable="true" style="padding: 4px;">${escapeHtml(line.name || line.description)}</td>
                      <td contenteditable="true" style="padding: 4px; text-align: right;">${fmtMoney(rate)}</td>
                      <td contenteditable="true" style="padding: 4px; text-align: right; font-weight: 600;">${fmtMoney(line.total)}</td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>

          <div>
            ${isLast ? `
              <div style="margin-top: 10px; border-top: 1.5px solid #0f172a; padding-top: 6px; display: flex; justify-content: space-between; align-items: flex-start;">
                <div style="font-size: 8pt; max-width: 60%;">
                  <strong>Notes:</strong> <span contenteditable="true">${escapeHtml(doc.notes || 'Thank you for your business!')}</span>
                </div>
                <div style="text-align: right; font-size: 9pt;">
                  <div style="font-size: 10.5pt; font-weight: 700;">TOTAL: <span contenteditable="true">${fmtMoney(doc.total)}</span></div>
                  ${doc.paidAmount > 0 ? `<div contenteditable="true" style="font-size: 8pt;">Paid: ${fmtMoney(doc.paidAmount)} | Bal: ${fmtMoney(Math.max(0, doc.total - doc.paidAmount))}</div>` : ''}
                </div>
              </div>
              ${renderFooter('Authorized Signature', 'Customer / Receiver Signature')}
            ` : `
              <div style="text-align: right; font-size: 8pt; font-style: italic; padding-top: 8px;">
                Continued on Page ${pIdx + 2} of ${chunks.length}...
              </div>
            `}
            <div style="text-align: center; font-size: 7pt; color: #64748b; margin-top: 6px;">Page ${pIdx + 1} of ${chunks.length}</div>
          </div>
        </div>
      `;
    }).join('');
  }

  // Single-Page Vouchers (Bill Payment Voucher & Payslip)
  if (docType === 'paybill') {
    const bp = db.billPayments.find(x => x.id === id);
    if (!bp) return '';
    const bank = db.banks.find(b => b.id === bp.bankId)?.name || 'Cash';
    return `
      <div class="${pageClass}" style="${pageStyle}">
        <div>
          ${renderHeader('PAYMENT VOUCHER', bp.number, bp.date, formatTxnTimestamp(bp))}
          <div style="border: 1px solid #cbd5e1; padding: 8px; border-radius: 4px; font-size: 8.5pt; margin-bottom: 10px;">
            <div><strong>Paid To Vendor:</strong> <span contenteditable="true">${escapeHtml(bp.vendorName)}</span></div>
            <div><strong>Payment Source:</strong> <span contenteditable="true">${escapeHtml(bank)}</span></div>
          </div>
          <table style="width: 100%; border-collapse: collapse; font-size: 8.5pt;">
            <thead><tr style="border-top: 1px solid #0f172a; border-bottom: 1px solid #0f172a;"><th style="padding: 5px; text-align: left;">Reference</th><th style="padding: 5px; text-align: left;">Particulars</th><th style="padding: 5px; text-align: right;">Amount</th></tr></thead>
            <tbody>
              <tr style="border-bottom: 1px solid #e2e8f0;">
                <td contenteditable="true" style="padding: 6px 5px;">${escapeHtml(bp.billNumber)}</td>
                <td contenteditable="true" style="padding: 6px 5px;">${escapeHtml(bp.notes || 'Supplier bill disbursement')}</td>
                <td contenteditable="true" style="padding: 6px 5px; text-align: right; font-weight: 700;">${fmtMoney(bp.amount)}</td>
              </tr>
            </tbody>
          </table>
          <div style="margin-top: 12px; text-align: right; font-size: 11pt; font-weight: 700; border-top: 1.5px solid #0f172a; padding-top: 6px;">
            TOTAL DISBURSED: <span contenteditable="true">${fmtMoney(bp.amount)}</span>
          </div>
        </div>
        ${renderFooter('Approved By', 'Payee / Vendor Signature')}
      </div>
    `;
  }

  if (docType === 'payslip') {
    const pr = db.payrolls.find(x => x.id === id);
    if (!pr) return '';
    return `
      <div class="${pageClass}" style="${pageStyle}">
        <div>
          ${renderHeader('EMPLOYEE PAYSLIP', pr.number, pr.date, formatTxnTimestamp(pr))}
          <div style="border: 1px solid #cbd5e1; padding: 8px; border-radius: 4px; font-size: 8.5pt; margin-bottom: 10px;">
            <div><strong>Employee Name:</strong> <span contenteditable="true">${escapeHtml(pr.employeeName)}</span></div>
            <div><strong>Position:</strong> <span contenteditable="true">${escapeHtml(pr.position)}</span></div>
            <div><strong>Pay Period:</strong> <span contenteditable="true">${escapeHtml(pr.period)}</span></div>
          </div>
          <table style="width: 100%; border-collapse: collapse; font-size: 8.5pt;">
            <thead><tr style="border-top: 1px solid #0f172a; border-bottom: 1px solid #0f172a;"><th style="padding: 5px; text-align: left;">Earnings / Deductions</th><th style="padding: 5px; text-align: right;">Amount</th></tr></thead>
            <tbody>
              <tr style="border-bottom: 1px solid #e2e8f0;"><td contenteditable="true" style="padding: 5px;">Basic Pay</td><td contenteditable="true" style="padding: 5px; text-align: right;">${fmtMoney(pr.basicPay)}</td></tr>
              <tr style="border-bottom: 1px solid #e2e8f0;"><td contenteditable="true" style="padding: 5px;">Allowance / Overtime</td><td contenteditable="true" style="padding: 5px; text-align: right;">${fmtMoney(pr.allowance)}</td></tr>
              <tr style="border-bottom: 1px solid #e2e8f0;"><td contenteditable="true" style="padding: 5px;">Less: Deductions</td><td contenteditable="true" style="padding: 5px; text-align: right;">-${fmtMoney(pr.deductions)}</td></tr>
            </tbody>
          </table>
          <div style="margin-top: 12px; text-align: right; font-size: 11pt; font-weight: 700; border-top: 1.5px solid #0f172a; padding-top: 6px;">
            NET TAKE-HOME PAY: <span contenteditable="true">${fmtMoney(pr.netPay)}</span>
          </div>
        </div>
        ${renderFooter('Employer / HR Signature', 'Employee Signature')}
      </div>
    `;
  }

  return '';
}

function applyPrintOrientationCSS(orientation) {
  printOrientation = orientation;
  const styleTag = document.getElementById('dynamic-print-page-style');
  if (styleTag) {
    styleTag.textContent = orientation === 'landscape'
      ? `@media print { @page { size: 8.5in 5.5in landscape; margin: 0.25in; } }`
      : `@media print { @page { size: 5.5in 8.5in portrait; margin: 0.25in; } }`;
  }
}

let activePrintDocType = '';
let activePrintDocId = '';

function setPrintPreviewOrientation(orientation) {
  applyPrintOrientationCSS(orientation);
  const canvas = document.getElementById('print-preview-editable-canvas');
  if (canvas) {
    canvas.innerHTML = buildPrintableHtml(activePrintDocType, activePrintDocId, orientation);
  }
  const btnP = document.getElementById('btn-orient-portrait');
  const btnL = document.getElementById('btn-orient-landscape');
  if (btnP && btnL) {
    btnP.className = `px-3 py-1.5 rounded-lg text-xs font-medium transition ${orientation === 'portrait' ? 'bg-slate-900 text-white' : 'bg-white text-slate-700 border border-slate-200 hover:bg-slate-50'}`;
    btnL.className = `px-3 py-1.5 rounded-lg text-xs font-medium transition ${orientation === 'landscape' ? 'bg-slate-900 text-white' : 'bg-white text-slate-700 border border-slate-200 hover:bg-slate-50'}`;
  }
}

function triggerFinalPrint() {
  const canvas = document.getElementById('print-preview-editable-canvas');
  const printArea = document.getElementById('print-area');
  if (!canvas || !printArea) return;

  printArea.innerHTML = canvas.innerHTML;
  setTimeout(() => {
    window.print();
  }, 100);
}

function printDocument(docType, id) {
  activePrintDocType = docType;
  activePrintDocId = id;
  applyPrintOrientationCSS(printOrientation);

  const initialHtml = buildPrintableHtml(docType, id, printOrientation);
  if (!initialHtml) {
    showToast('Unable to generate print preview.', 'error');
    return;
  }

  openModal('Editable Print Preview & Layout', `
    <div class="space-y-3">
      <div class="flex flex-wrap items-center justify-between gap-3 bg-slate-50 p-3 rounded-xl border border-slate-200">
        <div class="text-xs text-slate-600">
          <span class="font-semibold text-slate-900">Inline Edit Ready:</span> Click any text, amount, address, or note inside the sheet below to edit before printing.
        </div>
        <div class="flex items-center gap-1.5">
          <span class="text-[11px] font-medium text-slate-400 mr-1">Orientation:</span>
          <button id="btn-orient-portrait" type="button" onclick="setPrintPreviewOrientation('portrait')" class="px-3 py-1.5 rounded-lg text-xs font-medium transition ${printOrientation === 'portrait' ? 'bg-slate-900 text-white' : 'bg-white text-slate-700 border border-slate-200 hover:bg-slate-50'}">
            ▯ Portrait
          </button>
          <button id="btn-orient-landscape" type="button" onclick="setPrintPreviewOrientation('landscape')" class="px-3 py-1.5 rounded-lg text-xs font-medium transition ${printOrientation === 'landscape' ? 'bg-slate-900 text-white' : 'bg-white text-slate-700 border border-slate-200 hover:bg-slate-50'}">
            ▭ Landscape
          </button>
        </div>
      </div>

      <div class="bg-slate-100/80 p-4 rounded-xl border border-slate-200 overflow-x-auto max-h-[62vh]">
        <div id="print-preview-editable-canvas" class="print-editable space-y-4">
          ${initialHtml}
        </div>
      </div>
    </div>
  `, `
    <button onclick="closeModal()" class="px-4 py-2 rounded-xl border border-slate-200 text-xs font-medium">Close</button>
    <button onclick="triggerFinalPrint()" class="px-5 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-medium">
      🖨 Print Document Now
    </button>
  `, 'max-w-5xl');
}

// ============================================================================
// INITIALIZATION
// ============================================================================
window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('header-company-name').textContent = db.company.name;
  navigate('dashboard');
});
</script>
